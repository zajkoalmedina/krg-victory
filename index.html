<style>
/* Layout: phone app shell — sticky header, scrolling screen, fixed bottom tab bar; logo pink ring + magenta ribbon drive the palette */

  --ok:#5FD195; --ok-soft:#173525; --warn:#F0B755; --warn-soft:#3A2B12; --bad:#FF8A93; --bad-soft:#3E1A1F;
  --gold:#E8B53C; --silver:#B9C0C8; --bronze:#D58D57; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

/* tab bar */

.ev{display:flex;gap:12px}

.tbl{overflow-x:auto}

td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}

.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}.mx{background:var(--sunk);color:var(--muted)}

let base=null,PROFIL=null,syncQ=Promise.resolve(),loading=false;

const t5=t=>t?String(t).slice(0,5):"";
const locStamp=ts=>{const d=new Date(ts);return iso(d)+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};

/* ---------- učitavanje svega što korisnik smije vidjeti ---------- */
async function loadAll(){
  loading=true;
  const T=n=>q(sb.from(n).select("*"));
  const isAdm=PROFIL.uloga==="admin";
  const [lok,cij,post,prof,grupe,gtr,term,clan,dod,upl,pris,izm,obv,tak,prij,rez,por,proc,poz]=await Promise.all([
    T("lokacije"),T("cijene"),T("postavke"),T("profili"),T("grupe"),T("grupe_treneri").catch(()=>[]),T("termini"),T("clanice"),T("clanice_dodatne"),T("uplate"),T("prisustvo"),
    T("izmjene"),T("obavijesti"),T("takmicenja"),T("prijave"),T("rezultati"),q(sb.from("poruke").select("*").order("vrijeme")),T("procitano"),isAdm?T("pozivnice"):Promise.resolve([])]);
  const n={role:PROFIL.uloga==="trener"?"trener":PROFIL.uloga,me:PROFIL.id,meKid:PROFIL.clanica_id};
  n.lok=lok.map(l=>({id:l.id,name:l.naziv})).sort((a,b)=>a.name.localeCompare(b.name,"bs"));
  n.cfg={cijene:cij.sort((a,b)=>(a.redoslijed||0)-(b.redoslijed||0)).map(c=>({id:c.id,tip:c.tip,l:c.opis,v:+c.iznos,j:c.jedinica||"",a:c.cijena_a,b:c.cijena_b})),napomena:post[0]?.napomena_cjenovnik||""};
  n.staff=prof.filter(p=>p.aktivan&&(p.uloga==="admin"||p.uloga==="trener")).map(p=>({id:p.id,ime:p.ime||p.email,uloga:p.uloga,mail:p.email,tel:p.telefon||""}));
  n.prof=prof;
  n.rod={};prof.filter(p=>p.uloga==="roditelj").forEach(p=>n.rod[p.id]={name:p.ime||p.email,tel:p.telefon||"",mail:p.email});
  n.inv={};poz.forEach(p=>n.inv[p.email]={email:p.email,uloga:p.uloga,ime:p.ime||"",telefon:p.telefon||"",clanica_id:p.clanica_id||null});
  poz.filter(p=>p.uloga==="roditelj").forEach(p=>{if(!prof.some(x=>x.email===p.email))n.rod["e:"+p.email]={name:p.ime||p.email,tel:p.telefon||"",mail:p.email}});
  n.grupe=grupe.map(g=>{const ds=term.filter(t=>t.grupa_id===g.id).sort((a,b)=>a.dan-b.dan).map(t=>[t.dan,t5(t.od),t5(t.do),t.lokacija_id]);
    const tr=gtr.filter(t=>t.grupa_id===g.id).sort((a,b)=>a.redoslijed-b.redoslijed).map(t=>t.trener_id);if(!tr.length&&g.trener_id)tr.push(g.trener_id);
    return{id:g.id,name:g.naziv,cijena:g.cijena_id,trener:tr[0]||g.trener_id,treneri:tr,dodatni:g.dodatni,arh:g.arhivirana,days:ds,locId:ds[0]?.[3]||null}});
  n.kids=clan.map(c=>{const rod=c.roditelj_id||(c.roditelj_email?"e:"+c.roditelj_email.toLowerCase():"");
    if(rod.startsWith("e:")&&!n.rod[rod])n.rod[rod]={name:c.roditelj_email,tel:"",mail:c.roditelj_email};
    return{id:c.id,ime:c.ime,dob:c.datum_rodjenja||"",upis:c.datum_upisa||"",grupa:c.grupa_id,rod,status:c.status,cijena:c.cijena_id||undefined,
      dod:dod.filter(d=>d.clanica_id===c.id).map(d=>d.grupa_id),pristup:c.pristup_email?{mail:c.pristup_email,on:c.pristup_aktivan}:undefined}});
  n.pay={};upl.forEach(u=>{(n.pay[u.clanica_id]=n.pay[u.clanica_id]||{})[u.mjesec.slice(0,7)]={s:u.status,paid:+u.uplaceno||0,d:u.datum||undefined}});
  n.att={};pris.forEach(p=>{(n.att[p.datum+"|"+p.grupa_id]=n.att[p.datum+"|"+p.grupa_id]||{})[p.clanica_id]=p.stanje});
  n.izmjene=izm.map(z=>({id:z.id,g:z.grupa_id,date:z.datum,type:z.tip,od:t5(z.od),do:t5(z.do),locId:z.lokacija_id,note:z.napomena||""}));
  n.notices=obv.map(o=>({id:o.id,kind:o.vrsta,title:o.naslov,body:o.tekst||"",d:iso(new Date(o.napravljeno)),from:o.autor_id,tgt:cilj2tgt(o.cilj),ts:o.napravljeno})).sort((a,b)=>b.ts.localeCompare(a.ts));
  n.events=tak.map(e=>({id:e.id,naziv:e.naziv,mjesto:e.mjesto||"",datum:e.datum,datumDo:e.datum_do||undefined,prijavaDo:e.prijava_do,kotizacija:+e.kotizacija||0,pozvane:e.pozvane||null,
    prijave:prij.filter(p=>p.takmicenje_id===e.id).map(p=>p.clanica_id),placeno:prij.filter(p=>p.takmicenje_id===e.id&&p.kotizacija_placena).map(p=>p.clanica_id)}));
  n.results=rez.map(r=>({id:r.id,eventId:r.takmicenje_id,kidId:r.clanica_id,kategorija:r.kategorija||"–",rekvizit:r.rekvizit||"",ocjena:+r.ocjena,plasman:r.plasman}));
  n.threads={};await fillThreads(n,por);
  n.seen={};const suf=(n.role==="roditelj"||n.role==="clanica")?"|r":"|t";proc.forEach(p=>n.seen[fromNit(p.nit)+suf]=locStamp(p.vrijeme)+":99");
  S=n;PARENT=n.role==="roditelj"?n.me:null;
  base=rowsFromS();loading=false;
}
async function fillThreads(n,por){
  const paths=por.filter(m=>m.slika&&!m.obrisana).map(m=>m.slika);let urls={};
  if(paths.length){try{const r=await sb.storage.from("slike").createSignedUrls(paths,60*60*24);(r.data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}catch(e){}}
  por.forEach(m=>{const k=fromNit(m.nit);(n.threads[k]=n.threads[k]||[]).push({id:m.id,autor:m.autor_id,mine:!!PROFIL&&m.autor_id===PROFIL.id,del:!!m.obrisana,f:m.od,x:m.obrisana?"":(m.tekst||""),img:m.obrisana||!m.slika?"":urls[m.slika]||"",t:locStamp(m.vrijeme)})});
}
async function refreshMessages(){
  if(!PROFIL||loading||document.hidden)return;
  try{const por=await q(sb.from("poruke").select("*").order("vrijeme"));const before=JSON.stringify(Object.values(S.threads).map(t=>t.length));
    const n={threads:{}};await fillThreads(n,por);S.threads=n.threads;
    const ae=document.activeElement;if(JSON.stringify(Object.values(S.threads).map(t=>t.length))!==before&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))){if(tab==="msg")view.scrollEnd=true;render()}}catch(e){}
}

/* ---------- stanje → redovi tabela ---------- */
function rowsFromS(){
  const T={};const put=(t,k,r)=>{(T[t]=T[t]||{})[k]=r};
  ["lokacije","cijene","postavke","profili","grupe","grupe_treneri","termini","clanice","clanice_dodatne","pozivnice","uplate","prisustvo","izmjene","takmicenja","prijave","rezultati","obavijesti"].forEach(t=>T[t]={});
  S.lok.forEach(l=>put("lokacije",l.id,{id:l.id,naziv:l.name}));
  S.cfg.cijene.forEach((c,i)=>put("cijene",c.id,{id:c.id,tip:c.tip,opis:c.l,iznos:c.v,jedinica:c.tip==="ostalo"?(c.j||null):null,cijena_a:c.tip==="sestre"?c.a:null,cijena_b:c.tip==="sestre"?c.b:null,redoslijed:i}));
  put("postavke","1",{id:1,napomena_cjenovnik:S.cfg.napomena});
  if(S.role==="admin")S.staff.forEach(s=>put("profili",s.id,{id:s.id,ime:s.ime,telefon:s.tel||null,uloga:s.uloga}));
  S.grupe.forEach(g=>{const tr=gTr(g);put("grupe",g.id,{id:g.id,naziv:g.name,cijena_id:g.cijena||null,trener_id:tr[0]||null,dodatni:!!g.dodatni,arhivirana:!!g.arh});
    tr.forEach((t,i)=>put("grupe_treneri",g.id+"|"+t,{grupa_id:g.id,trener_id:t,redoslijed:i}));
    g.days.forEach(d=>put("termini",g.id+"|"+d[0],{grupa_id:g.id,dan:d[0],od:d[1],do:d[2],lokacija_id:d[3]||g.locId}))});
  S.kids.forEach(k=>{const pend=k.rod.startsWith("e:");
    put("clanice",k.id,{id:k.id,ime:k.ime,datum_rodjenja:k.dob||null,datum_upisa:k.upis||null,grupa_id:k.grupa||null,roditelj_id:pend||!k.rod?null:k.rod,
      roditelj_email:pend?k.rod.slice(2):(S.rod[k.rod]?.mail||null),status:k.status,cijena_id:k.cijena||null,pristup_email:k.pristup?.mail||null,pristup_aktivan:!!k.pristup?.on});
    (k.dod||[]).forEach(g=>put("clanice_dodatne",k.id+"|"+g,{clanica_id:k.id,grupa_id:g}))});
  if(S.role==="admin")Object.values(S.inv).forEach(v=>put("pozivnice",v.email,{email:v.email,uloga:v.uloga,ime:v.ime||null,telefon:v.telefon||null,clanica_id:v.clanica_id||null}));
  Object.entries(S.pay).forEach(([k,ms])=>Object.entries(ms).forEach(([m,p])=>put("uplate",k+"|"+m,{clanica_id:k,mjesec:m+"-01",status:p.s,uplaceno:p.paid||0,datum:p.d||null})));
  Object.entries(S.att).forEach(([key,v])=>{const[d,g]=key.split("|");Object.entries(v).forEach(([k,x])=>{if(x)put("prisustvo",key+"|"+k,{datum:d,grupa_id:g,clanica_id:k,stanje:x})})});
  S.izmjene.forEach(z=>put("izmjene",z.id,{id:z.id,grupa_id:z.g,datum:z.date,tip:z.type,od:z.type==="cancel"?null:z.od,do:z.type==="cancel"?null:z.do,lokacija_id:z.type==="cancel"?null:z.locId,napomena:z.note||null}));
  S.events.forEach(e=>{put("takmicenja",e.id,{id:e.id,naziv:e.naziv,mjesto:e.mjesto||null,datum:e.datum,datum_do:e.datumDo||null,prijava_do:e.prijavaDo,kotizacija:e.kotizacija||0,pozvane:e.pozvane||null});
    e.prijave.forEach(k=>put("prijave",e.id+"|"+k,{takmicenje_id:e.id,clanica_id:k,kotizacija_placena:(e.placeno||[]).includes(k)}))});
  S.results.forEach(r=>put("rezultati",r.id,{id:r.id,takmicenje_id:r.eventId,clanica_id:r.kidId,kategorija:r.kategorija,rekvizit:r.rekvizit,ocjena:r.ocjena,plasman:r.plasman}));
  S.notices.forEach(n=>put("obavijesti",n.id,{id:n.id,vrsta:n.kind,naslov:n.title,tekst:n.body||null,cilj:tgt2cilj(n.tgt),autor_id:n.from}));
  return T;
}
const PK={grupe_treneri:["grupa_id","trener_id"],termini:["grupa_id","dan"],clanice_dodatne:["clanica_id","grupa_id"],uplate:["clanica_id","mjesec"],prisustvo:["datum","grupa_id","clanica_id"],prijave:["takmicenje_id","clanica_id"],pozivnice:["email"]};
const ORDER=["lokacije","cijene","postavke","profili","grupe","grupe_treneri","termini","clanice","clanice_dodatne","pozivnice","uplate","prisustvo","izmjene","takmicenja","prijave","rezultati","obavijesti"];
const NOINS={profili:1,postavke:1};
function match(t,r){const ks=PK[t]||["id"];const o={};ks.forEach(k=>o[k]=r[k]);return o}

/* ---------- spremanje: šalje samo ono što se promijenilo ---------- */
function save(){
  if(!base||loading)return true;
  const cur=rowsFromS(),ops=[];
  ORDER.forEach(t=>{const a=base[t]||{},b=cur[t]||{};
    Object.keys(b).forEach(k=>{if(!a[k]){if(!NOINS[t])ops.push({t,op:"ins",r:b[k]})}else if(JSON.stringify(a[k])!==JSON.stringify(b[k]))ops.push({t,op:"upd",r:b[k]})})});
  ORDER.slice().reverse().forEach(t=>{const a=base[t]||{},b=cur[t]||{};
    Object.keys(a).forEach(k=>{if(!b[k])ops.push({t,op:"del",r:a[k]})})});
  base=cur;
  if(!ops.length)return true;
  const doOps=async()=>{
    // brisanja termina idu prije upisa (da se dan može premjestiti)
    for(const o of ops.filter(o=>o.op==="del"&&o.t==="termini"))await q(sb.from(o.t).delete().match(match(o.t,o.r)));
    for(const o of ops.filter(o=>o.op!=="del")){
      if(o.op==="ins"){const r={...o.r};if(o.t==="prijave")r.prijavio=S.me;await q(sb.from(o.t).insert(r))}
      else if(o.t==="profili")await q(sb.from("profili").update({ime:o.r.ime,telefon:o.r.telefon,uloga:o.r.uloga}).eq("id",o.r.id));
      else await q(sb.from(o.t).update(o.r).match(match(o.t,o.r)));
    }
    for(const o of ops.filter(o=>o.op==="del"&&o.t!=="termini")){
      if(o.t==="profili")await q(sb.from("profili").update({aktivan:false}).eq("id",o.r.id));
      else if(o.t!=="postavke")await q(sb.from(o.t).delete().match(match(o.t,o.r)));
    }
  };
  syncQ=syncQ.then(doOps).then(()=>setNet(true)).catch(async e=>{console.error(e);
    toast(netMsg(e));try{await loadAll();render()}catch(x){}});
  return true;
}
function netMsg(e){const m=String(e?.message||e||"");
  if(/row-level security|permission|42501/i.test(m))return"Nemate dozvolu za ovu promjenu. Podaci su osvježeni.";
  if(/fetch|network|Failed/i.test(m)){setNet(false);return"Nema interneta. Promjena nije sačuvana."}
  if(/duplicate|23505/i.test(m))return"Ovo već postoji. Podaci su osvježeni.";
  if(/foreign key|23503/i.test(m))return"Ovo se koristi na drugom mjestu pa se ne može obrisati.";
  return"Promjena nije sačuvana: "+m.slice(0,80)}
function setNet(ok){const b=document.getElementById("offline");if(b)b.hidden=ok}

/* ---------- poruke ---------- */
function myOd(){return S.role==="roditelj"?"parent":S.role==="clanica"?"kid":"staff"}
async function sendToDb(p,m,blob){
  const nit=toNit(p),row={id:m.id||uid(),nit,autor_id:S.me,od:myOd(),tekst:m.x||null,slika:null};
  try{if(blob){const path=nit+"/"+uid()+".jpg";const up=await sb.storage.from("slike").upload(path,blob,{contentType:"image/jpeg"});if(up.error)throw up.error;row.slika=path}
    await q(sb.from("poruke").insert(row));}
  catch(e){console.error(e);toast(netMsg(e));const th=S.threads[p]||[];const i=th.findIndex(x=>x.tmp===m.tmp);if(i>=0)th.splice(i,1);render()}
}
function markSeen(p){const k=p+(isFam()?"|r":"|t"),now=nowStamp();if((S.seen[k]||"").slice(0,16)===now)return;S.seen[k]=now+":99";
  sb.from("procitano").upsert({nit:toNit(p),korisnik_id:S.me,vrijeme:new Date().toISOString()}).then(()=>{},()=>{})}

function canDelMsg(m){return !!m.id&&!m.del&&!m.tmpErr&&(m.mine||S.role==="admin")}
function askDelMsg(p,id){const m=(S.threads[p]||[]).find(x=>x.id===id);if(!m||!canDelMsg(m))return;
  ask(`${m.mine?"Obrisati vašu poruku?":"Obrisati tuđu poruku kao administrator?"}<br><span class="small muted">„${esc((m.x||"📷 Fotografija").slice(0,80))}“ · Na njenom mjestu objema stranama piše „🚫 Poruka je obrisana“.</span>`,"Obriši poruku",()=>delMsg(p,id))}
async function delMsg(p,id){const m=(S.threads[p]||[]).find(x=>x.id===id);if(!m)return;const old={x:m.x,img:m.img,del:m.del};
  Object.assign(m,{x:"",img:"",del:true});render();
  try{const r=await sb.rpc("obrisi_poruku",{poruka:id});if(r.error)throw r.error;toast("Poruka obrisana")}
  catch(e){console.error(e);Object.assign(m,old);render();toast(/42501|ne možete|security/i.test(String(e.message||e))?"Ovu poruku ne možete obrisati.":netMsg(e))}}
function askDelThread(p){const name=isKidT(p)?tKid(p)?.ime:rodN(p);
  ask(`Obrisati cijeli razgovor s <b>${esc(name||"")}</b>? Sve poruke nestaju i kod druge osobe. Ovo se ne može vratiti.`,"Obriši razgovor",async()=>{
    try{const r=await sb.rpc("obrisi_razgovor",{razgovor:toNit(p)});if(r.error)throw r.error;delete S.threads[p];view={seg:"chat"};render();toast("Razgovor obrisan")}
    catch(e){console.error(e);toast(/42501|administrator/i.test(String(e.message||e))?"Samo administrator može obrisati razgovor.":netMsg(e))}})}
function askDelNotice(id){const n=S.notices.find(x=>x.id===id);if(!n)return;
  ask(`Obrisati obavijest <b>„${esc(n.title)}“</b>? Nestat će svim roditeljima kojima je poslana.`,"Obriši obavijest",()=>{S.notices=S.notices.filter(x=>x.id!==id);save();render();toast("Obavijest obrisana")})}

/* ---------- prijava / registracija ---------- */
let authMode="login",recovery=false;
function authView(){
  const m=recovery?"reset":authMode;
  return `<div class="wrap login"><img class="logo" src="logo.png" alt="Logo KRG Victory Hadžići">
  <div style="text-align:center"><h1>KRG Victory</h1><p class="muted" style="margin:4px 0 0">Klub ritmičke gimnastike · Hadžići</p></div>
  ${m==="reset"?`<div class="card stack"><h2 style="font-size:20px">Nova lozinka</h2><label class="f">Nova lozinka (najmanje 8 znakova)<input id="aP" type="password" autocomplete="new-password"></label><p id="aErr" class="err" hidden></p><button class="btn block" onclick="doReset()">Sačuvaj lozinku</button></div>`
  :`<div class="seg"><button class="${m==="login"?"on":""}" onclick="authMode='login';render()">Prijava</button><button class="${m==="signup"?"on":""}" onclick="authMode='signup';render()">Registracija</button></div>
  <form class="card stack" onsubmit="event.preventDefault();${m==="login"?"doLogin()":m==="signup"?"doSignup()":"doForgot()"}">
  ${m==="signup"?`<p class="small muted" style="margin:0">Registrujte se s e-mailom koji ste dali klubu. Drugi e-mail neće biti prihvaćen.</p><label class="f">Ime i prezime<input id="aI" autocomplete="name"></label><label class="f">Telefon (nije obavezno)<input id="aT" type="tel" autocomplete="tel"></label>`:""}
  ${m==="forgot"?`<p class="small muted" style="margin:0">Upišite e-mail. Poslat ćemo vam link za novu lozinku.</p>`:""}
  <label class="f">E-mail<input id="aM" type="email" autocomplete="username" inputmode="email"></label>
  ${m!=="forgot"?`<label class="f">Lozinka${m==="signup"?" (najmanje 8 znakova)":""}<input id="aP" type="password" autocomplete="${m==="signup"?"new-password":"current-password"}"></label>`:""}

  if(/Invalid login/i.test(m))return"Pogrešan e-mail ili lozinka.";
  if(/not confirmed/i.test(m))return"E-mail još nije potvrđen. Otvorite poruku od Supabase u svom e-mailu i kliknite link.";
  if(/Database error|nije pozvan/i.test(m))return"Ovaj e-mail nije pozvan u KRG Victory. Javite se upravi kluba.";
  if(/already registered|already exists/i.test(m))return"Ovaj e-mail već ima račun. Prijavite se.";
  if(/Password should|at least/i.test(m))return"Lozinka mora imati najmanje 8 znakova.";

async function afterLogin(){
  const u=(await sb.auth.getUser()).data?.user;if(!u){PROFIL=null;render();return}
  const pr=await sb.from("profili").select("*").eq("id",u.id).maybeSingle();
  if(pr.error||!pr.data){toast("Profil nije pronađen. Javite se upravi kluba.");await sb.auth.signOut();PROFIL=null;render();return}
  if(!pr.data.aktivan){toast("Vaš pristup je ukinut. Javite se upravi kluba.");await sb.auth.signOut();PROFIL=null;render();return}
  PROFIL=pr.data;
  // ime i telefon s registracije, ako ih pozivnica nije imala
  let md=u.user_metadata||{};try{const l=JSON.parse(localStorage.getItem("krgv-ime")||"null");if(l&&l.e===u.email)md={ime:md.ime||l.i,telefon:md.telefon||l.t}}catch(x){}

  tab=null;view={};render();

async function boot(){

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>{if(!s)return"";const d=pd(s);return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear()+"."};

function kidFee(k){
  const base=x=>crow(kidRow(x))?.v??0;
  const fam=S.kids.filter(x=>x.rod===k.rod&&x.status==="aktivna").sort((a,b)=>base(b)-base(a)||a.id.localeCompare(b.id,undefined,{numeric:true}));
  const i=fam.findIndex(x=>x.id===k.id);
  if(i!==1)return base(k);
  const ra=kidRow(fam[0]),rb=kidRow(fam[1]);
  const pr=S.cfg.cijene.find(c=>c.tip==="sestre"&&((c.a===ra&&c.b===rb)||(c.a===rb&&c.b===ra)));
  return pr?Math.max(0,pr.v-base(fam[0])):base(k);
}

function payOf(kId,m){const r=S.pay[kId]?.[m],k=kid(kId);
  if(r&&r.s!=="neplaceno")return r;            // plaćene/ostale se nikad ne diraju
  if(!elig(k,m))return{s:"prije",row:!!r};      // mjesec prije upisa: nije dug
  return r||{s:k?.status==="pauza"?"pauza":"neplaceno"}}

function setPay(kId,m,v){(S.pay[kId]=S.pay[kId]||{})[m]=v;save()}
function debtsOf(k){const out=[];let amt=0;const fee=kidFee(k);
  sezMonths(curSez()).filter(m=>m<=ym()).forEach(m=>{const p=payOf(k.id,m);
    if(p.s==="neplaceno"){amt+=fee;out.push(MJF[+m.split("-")[1]-1].toLowerCase())}
    if(p.s==="djelimicno"){amt+=fee-(p.paid||0);out.push(MJF[+m.split("-")[1]-1].toLowerCase()+" (djelimično)")}});
  return{amt,months:out}}

function sessionOn(g,date){

  if(reg)return{od:reg[1],do:reg[2],loc:reg[3]||g.locId};return null}
function nextSession(g){for(let i=0;i<21;i++){const d=addD(iso(today()),i);const s=sessionOn(g,d);if(s&&!s.cancel)return{date:d,...s}}return null}
function lastSessionDate(g){for(let i=0;i<21;i++){const d=addD(iso(today()),-i);const s=sessionOn(g,d);if(s&&!s.cancel)return d}return iso(today())}

function unreadFor(p){return(S.threads[p]||[]).filter(m=>!m.del&&m.f!=="staff"&&m.t>(S.seen[p+"|t"]||"")).length}
function unread(){if(isFam()){const p=myThread();return(S.threads[p]||[]).filter(m=>!m.del&&m.f==="staff"&&m.t>(S.seen[p+"|r"]||"")).length}
  return threadKeys().reduce((a,p)=>a+unreadFor(p),0)}
function noticesFor(p){const ks=S.role==="clanica"?myKids():S.kids.filter(k=>k.rod===p);const gs=ks.flatMap(k=>[k.grupa,...(k.dod||[])]);
  return S.notices.filter(n=>n.tgt==="all"||(n.tgt===p&&S.role!=="clanica")||gs.includes(n.tgt)||(n.tgt.startsWith("ev:")&&(()=>{const e=S.events.find(x=>x.id===n.tgt.slice(3));return e&&ks.some(k=>canEnter(e,k))})())).sort((a,b)=>b.d.localeCompare(a.d))}

const TABS={

function render(){
  const app=$("#app");
  if(!PROFIL||!S.role){app.innerHTML=authView();return}
  if(!tab)tab=TABS[S.role][0][0];
  const u=unread();
  const who=(S.role==="roditelj"?"Roditelj · ":S.role==="clanica"?"Članica · ":S.role==="admin"?"Administrator · ":"Trenerica · ")+(PROFIL.ime||PROFIL.email);
  app.innerHTML=`<header class="top"><div class="wrap"><img src="${LOGO}" alt="Logo KRG Victory"><div class="ttl"><b>KRG VICTORY</b><span>${esc(who)}</span></div><button class="rolebtn" onclick="logout()">Odjava</button></div><div id="offline" class="offline" hidden>Nema interneta. Promjene se ne čuvaju.</div></header>
  <main><div class="wrap">${(screens[tab]||screens[TABS[S.role][0][0]])()}</div></main>
  <nav class="tabs" aria-label="Glavni meni"><div class="in">${TABS[S.role].map(([k,l,ic])=>`<button onclick="go('${k}')" ${tab===k?'aria-current="page"':""}>${I[ic]}${l}${k==="msg"&&u?`<span class="dot">${u}</span>`:""}</button>`).join("")}</div></nav>`;
  if(view.scrollEnd)window.scrollTo(0,document.body.scrollHeight);
}
function go(t,v={}){tab=t;view=v;render();if(!v.scrollEnd)window.scrollTo(0,0)}
function back(){const p=view.parent;view=p||{};render();window.scrollTo(0,0)}
function sub(v){view={...v,parent:{...view,parent:undefined}};render();window.scrollTo(0,0)}
const screens={};

screens.home=()=>isFam()?parentHome():adminHome();

  const act=S.kids.filter(k=>k.status==="aktivna"),m=ym();
  let exp=0,col=0,paid=0,unp=0,ceka=0;
  act.forEach(k=>{const f=kidFee(k),p=payOf(k.id,m);if(NOPAY[p.s])return;exp+=f;if(p.s==="placeno"){col+=f;paid++}else if(p.s==="djelimicno"){col+=p.paid||0;unp++}else if(p.s==="ceka")ceka++;else unp++});
  const pend=act.filter(k=>payOf(k.id,m).s==="ceka");
  const nx=S.events.filter(e=>days(e.datumDo||e.datum)>=0).sort((a,b)=>a.datum.localeCompare(b.datum))[0];
  const tiles=[[act.length,"Aktivne članice","go('members')",""],[activeGroups().length,"Trening grupe","go('more',{s:'groups'})",""],[paid,"Plaćeno","go('pay',{f:'placeno'})","ok"],[unp,"Nije plaćeno","go('pay',{f:'neplaceno'})","bad"],[ceka,"Čeka potvrdu","go('pay',{f:'ceka'})","warn"],[unread(),"Nove poruke","go('msg')","pk"]];
  return `<div class="hero"><img src="${LOGO}" alt=""><div><div class="eyebrow">Sezona ${curSez()}</div><h1>Dobro došli!</h1><div class="small muted">${DAN[dIdx(iso(today()))]}, ${fd(iso(today()))}</div></div></div>
  <div class="card"><div class="eyebrow">Članarine · ${ymL(m)}</div><div class="row" style="margin-top:4px;align-items:baseline"><span class="score" style="font-size:30px">${col} KM</span><span class="muted">od ${exp} KM</span></div>
  <div class="bar"><div style="width:${exp?Math.min(100,col/exp*100):0}%"></div></div></div>
  <div class="tiles">${tiles.map(([v,l,c,cl])=>`<button class="tile ${cl}" onclick="${c}"><b>${v}</b><span>${l}</span></button>`).join("")}</div>
  <div class="eyebrow">Brze radnje</div>
  <div class="quick">${[["Dodaj članicu","memberForm()",I.users],["Nova obavijest","noticeForm()",I.bell],["Promjena termina","oneOffForm()",I.swap],["Novo takmičenje","eventForm()",I.trophy],["Izvoz u Excel","go('more',{s:'export'})",I.down],["Statistika","go('more',{s:'stats'})",I.chart]].map(([l,c,ic])=>`<button onclick="${c}">${ic}<span>${l}</span></button>`).join("")}</div>
  ${pend.length?`<div class="card"><div class="eyebrow">Uplate koje čekaju potvrdu</div><div class="list" style="margin-top:4px">${pend.map(k=>li(ini(k.ime),esc(k.ime),`${kidFee(k)} KM · prijavljeno ${fd(payOf(k.id,m).d)}`,`<button class="btn sm" onclick="confirmPay('${k.id}','${m}')">Potvrdi</button>`)).join("")}</div></div>`:""}
  ${nx?`<div class="card"><div class="eyebrow">Sljedeće takmičenje</div><div class="ev" style="margin-top:8px">${dateBox(nx)}<div class="grow"><h3>${esc(nx.naziv)}</h3><div class="meta"><span>${esc(nx.mjesto)}</span><span>Prijava do ${fd(nx.prijavaDo)}</span></div><div style="margin-top:6px">${evStatus(nx).h} ${chip(nx.prijave.length+" prijavljenih","pk")}</div></div></div></div>`:""}`;
}

};

  const k=kid(id),g=grp(k.grupa),r=S.rod[k.rod]||{};
  const attE=Object.entries(S.att).filter(([key,v])=>v[k.id]);const a={p:0,o:0,n:0};attE.forEach(([,v])=>a[v[k.id]]++);

  <div class="kv">${[["Datum rođenja",fd(k.dob)],["Datum upisa",fd(k.upis)||"–"],["Grupa",esc(g?.name||"–")+((k.dod||[]).length?" + "+k.dod.map(x=>esc(grp(x)?.name||"")).join(", "):"")],["Termini",esc(g?schedTxt(g):"–")],["Lokacija",esc(g?gLoc(g):"–")],["Članarina",kidFee(k)+" KM mjesečno"+(sibs.length?" (popust za sestre)":"")],["Roditelj",esc(r.name||"–")],["Telefon",esc(r.tel||"–")],["E-mail",esc(r.mail||"–")],sibs.length?["Sestre",sibs.map(x=>esc(x.ime)).join(", ")]:null].filter(Boolean).map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join("")}</div></div>
  <div class="card"><div class="eyebrow">Prisustvo · sezona ${curSez()}</div><div class="count">${["p","o","n"].map(x=>`<div><b>${a[x]}</b><span>${ATT[x][0].toLowerCase()}</span></div>`).join("")}</div></div>
  <div class="card"><div class="row"><div class="grow"><div class="eyebrow">Takmičenja</div><div class="small muted">${rs.length} nastupa ukupno</div></div><div class="medals">${[1,2,3].map(n=>`<div><span class="medal m${n}">${n}.</span>×${med(n)}</div>`).join("")}</div></div>
  <button class="btn ghost sm" style="margin-top:10px" onclick="go('comp',{seg:'res',mode:'kid',kid:'${id}',sz:'sve'})">Svi rezultati</button></div>
  <div class="card"><div class="eyebrow">Historija članarina</div><div class="list" style="margin-top:4px">${sezMonths(curSez()).filter(m=>m<=ym()&&(elig(k,m)||S.pay[id]?.[m]&&S.pay[id][m].s!=="neplaceno")).reverse().map(m=>{const p=payOf(id,m);return li(null,ymL(m),p.d?(p.s==="ceka"?"roditelj prijavio ":"uplaćeno ")+fd(p.d)+(p.s==="djelimicno"?` · ${p.paid} KM`:""):p.s==="obrisano"?"obrisana – nema obaveze":"",chip(...PAY[p.s])+(p.s==="obrisano"&&S.role==="admin"?`<button class="btn ghost sm" onclick="setPay('${id}','${m}',{s:'neplaceno'});render();toast('Članarina je vraćena')">Vrati</button>`:""))}).join("")||'<div class="li muted">Još nema članarina. Prva je za mjesec upisa.</div>'}</div></div>
  <div class="card"><div class="eyebrow">Račun roditelja · ${esc(r.name||"–")}</div><div class="list" style="margin-top:4px">${S.kids.filter(x=>x.rod===k.rod&&x.status!=="ispisana").map(x=>li(ini(x.ime),esc(x.ime),esc(grp(x.grupa)?.name||"")+" · "+kidFee(x)+" KM",x.id===id?chip("Ova članica","pk"):"",x.id===id?"":`sub({k:'${x.id}'})`)).join("")}</div>

  ${hasAccess(k)?`<div class="kv" style="margin-top:0"><div><span>E-mail za prijavu</span><b>${esc(k.pristup.mail)}</b></div></div><div class="acts" style="margin-top:0"><button class="btn ghost sm" onclick="copyInvite('${esc(k.pristup.mail)}','clanica')">Kopiraj poziv</button><button class="btn ghost sm" onclick="revokeAccess('${id}')">Ukini pristup</button></div>`
   :`<label class="f">E-mail članice<input id="kaM" type="email" value="${esc(k.pristup?.mail||"")}" placeholder="ime@primjer.ba"></label><p id="kaErr" class="err" hidden></p><button class="btn ghost" onclick="giveAccess('${id}')">Daj pristup i kopiraj poziv</button>`}</div>
  <div class="stack">${k.rod?`<button class="btn" onclick="ensureParentInv('${k.rod}');copyInvite('${esc(S.rod[k.rod]?.mail||(k.rod.startsWith("e:")?k.rod.slice(2):""))}','roditelj')">${k.rod.startsWith("e:")?"Kopiraj poziv za roditelja":"Kopiraj link aplikacije za roditelja"}</button>`:""}
  <button class="btn ghost" onclick="memberForm('${id}')">Uredi podatke</button>
  ${k.status==="aktivna"?`<button class="btn ghost" onclick="setStatus('${id}','pauza')">Stavi na pauzu</button>`:`<button class="btn ghost" onclick="setStatus('${id}','aktivna')">Vrati među aktivne</button>`}
  ${k.status!=="ispisana"?`<button class="btn ghost" onclick="setStatus('${id}','ispisana')">Arhiviraj članicu (ispisana)</button>`:""}</div>
  <p class="small muted">Arhivirana članica ostaje sačuvana s rezultatima i uplatama. Možete je vratiti bilo kada.</p>`;
}
function giveAccess(id){const m=$("#kaM").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m)){const e=$("#kaErr");e.textContent="Upišite ispravan e-mail članice.";e.hidden=false;return}
  const k=kid(id);k.pristup={mail:m,on:true};
  const pr=(S.prof||[]).find(p=>p.clanica_id===id);
  if(pr){sb.from("profili").update({aktivan:true}).eq("id",pr.id).then(()=>{},()=>{})}else S.inv[m]={email:m,uloga:"clanica",ime:k.ime,telefon:"",clanica_id:id};
  save();render();if(!pr)copyInvite(m,"clanica");else toast("Pristup je vraćen.")}
function revokeAccess(id){const k=kid(id);k.pristup.on=false;delete S.inv[k.pristup.mail];
  const pr=(S.prof||[]).find(p=>p.clanica_id===id);if(pr)sb.from("profili").update({aktivan:false}).eq("id",pr.id).then(()=>{},()=>toast("Pristup nije ukinut. Pokušajte ponovo."));
  save();render();toast("Pristup ukinut")}
function ensureParentInv(rod){if(!rod.startsWith("e:")||S.role!=="admin")return;const m=rod.slice(2);if(!S.inv[m]){const r=S.rod[rod]||{};S.inv[m]={email:m,uloga:"roditelj",ime:r.name||"",telefon:r.tel||"",clanica_id:null};save()}}
function setStatus(id,s){kid(id).status=s;save();render();toast(s==="ispisana"?"Članica je arhivirana":s==="pauza"?"Članica je na pauzi":"Članica je ponovo aktivna")}
function memberForm(id,rodPre){if(!activeGroups().some(g=>!g.dodatni))return toast("Prvo napravite trening grupu (Više → Trening grupe).");const k=id?kid(id):{ime:"",dob:"",grupa:activeGroups().find(g=>!g.dodatni)?.id,rod:rodPre||"",dod:[]};
  const gOpts=activeGroups().filter(g=>!g.dodatni).map(g=>`<option value="${g.id}" ${g.id===k.grupa?"selected":""}>${esc(g.name)}</option>`).join("");
  const extra=activeGroups().filter(g=>g.dodatni);
  sheet(`<h2>${id?"Uredi članicu":"Nova članica"}</h2>
  <div class="eyebrow">Podaci o članici</div>
  <label class="f">Ime i prezime<input id="mI" value="${esc(k.ime)}"></label>
  <div class="grid2"><label class="f">Datum rođenja<input id="mD" type="date" value="${k.dob}"></label><label class="f">Datum upisa<input id="mU" type="date" value="${k.upis||iso(today())}"></label></div>
  <label class="f">Trening grupa<select id="mG">${gOpts}</select></label>
  ${extra.length?`<div class="f">Dodatni treninzi${extra.map(g=>`<label class="checkrow"><input type="checkbox" id="mX_${g.id}" ${(k.dod||[]).includes(g.id)?"checked":""}> ${esc(g.name)} · ${esc(schedTxt(g))}</label>`).join("")}</div>`:""}
  <label class="f">Članarina<select id="mC"><option value="">Po grupi</option>${S.cfg.cijene.filter(c=>c.tip==="clan").map(c=>`<option value="${c.id}" ${c.id===k.cijena?"selected":""}>${esc(c.l)} · ${c.v} KM</option>`).join("")}</select></label>
  <div class="eyebrow">Roditeljski račun</div>
  <p class="small muted" style="margin:0">Sestre stavite na isti račun: izaberite roditelja koji već postoji. Roditelj se prijavljuje jednom i vidi obje djevojčice.</p>
  <label class="f">Roditelj<select id="mR" onchange="$('#newR').hidden=this.value!=='new'"><option value="new">+ Novi roditelj (novi račun)</option>${Object.entries(S.rod).map(([pid,r])=>`<option value="${pid}" ${pid===k.rod?"selected":""}>${esc(r.name)}${(()=>{const ks=S.kids.filter(x=>x.rod===pid&&x.status!=="ispisana"&&x.id!==id);return ks.length?" – račun: "+ks.map(x=>first(x.ime)).join(", "):""})()}</option>`).join("")}</select></label>
  <div id="newR" class="stack" ${k.rod?"hidden":""}><label class="f">Ime i prezime roditelja<input id="rN"></label><div class="grid2"><label class="f">E-mail (za prijavu)<input id="rM" type="email" inputmode="email"></label><label class="f">Telefon<input id="rT" type="tel"></label></div></div>
  <p class="small muted" style="margin:0">Za novog roditelja aplikacija pripremi poruku s linkom i e-mailom. Pošaljete je preko Vibera ili WhatsAppa. Ako roditelj već ima račun, dijete se samo doda na njegov račun.</p>
  <p id="fErr" class="err" hidden></p>
  <button class="btn block" onclick="saveMember('${id||""}')">${id?"Sačuvaj":"Sačuvaj i pošalji pozivnicu"}</button>`)}
function saveMember(id){const n=$("#mI").value.trim();let r=$("#mR").value;
  if(!n)return ferr("Upišite ime i prezime članice.");
  if(!$("#mG").value)return ferr("Prvo napravite trening grupu (Više → Trening grupe).");
  let newInv=null;
  if(r==="new"){const rn=$("#rN").value.trim(),rm=$("#rM").value.trim().toLowerCase();if(!rn)return ferr("Upišite ime roditelja ili izaberite postojećeg.");
    if(!/^\S+@\S+\.\S+$/.test(rm))return ferr("Upišite e-mail roditelja. S njim se roditelj prijavljuje.");
    const ex=Object.entries(S.rod).find(([pid,x])=>(x.mail||"").toLowerCase()===rm);
    if(ex)r=ex[0];else{r="e:"+rm;S.rod[r]={name:rn,tel:$("#rT").value.trim(),mail:rm};S.inv[rm]={email:rm,uloga:"roditelj",ime:rn,telefon:$("#rT").value.trim(),clanica_id:null};newInv=rm}}
  const dod=activeGroups().filter(g=>g.dodatni&&$("#mX_"+g.id)?.checked).map(g=>g.id);
  const d={ime:n,dob:$("#mD").value,upis:$("#mU").value,grupa:$("#mG").value,rod:r,dod,cijena:$("#mC").value||undefined};
  if(id)Object.assign(kid(id),d);else S.kids.push({id:uid(),status:"aktivna",...d});
  const sis=S.kids.filter(x=>x.rod===r&&x.status!=="ispisana").length;save();closeSheet();render();
  if(newInv){copyInvite(newInv,"roditelj")}else toast(id?"Podaci sačuvani":sis>1?first(n)+" je dodana na račun roditelja "+rodN(r):first(n)+" je dodana")}
function ferr(t){const e=$("#fErr");if(e){e.textContent=t;e.hidden=false}}

screens.pay=()=>{
  const m=view.m||ym(),f=view.f||"all";
  const act=S.kids.filter(k=>k.status!=="ispisana");
  let exp=0,col=0;act.forEach(k=>{if(k.status!=="aktivna")return;const fee=kidFee(k),p=payOf(k.id,m);if(NOPAY[p.s])return;exp+=fee;if(p.s==="placeno")col+=fee;if(p.s==="djelimicno")col+=p.paid||0});
  const pre=preUpis();
  const rows=act.filter(k=>{const s=payOf(k.id,m).s;if(NOPAY[s])return false;return f==="all"||(f==="neplaceno"?(s==="neplaceno"||s==="djelimicno"):s===f)}).sort((a,b)=>a.ime.localeCompare(b.ime,"bs"));
  const debts=S.kids.filter(k=>k.status==="aktivna").map(k=>({k,...debtsOf(k)})).filter(d=>d.amt>0);
  const months=sezMonths(curSez()).filter(x=>x<=ym());
  return `<div class="sec-h"><h2>Uplate</h2><select id="selM" class="rolebtn" onchange="view.m=this.value;render()">${months.map(x=>`<option value="${x}" ${x===m?"selected":""}>${ymL(x)}</option>`).join("")}</select></div>
  <div class="card"><div class="row" style="align-items:baseline"><span class="score" style="font-size:28px">${col} KM</span><span class="muted">od ${exp} KM</span></div><div class="bar"><div style="width:${exp?Math.min(100,col/exp*100):0}%"></div></div>
  <div class="small muted" style="margin-top:6px">Iznos po djetetu računa se po cjenovniku, s popustom za sestre.</div></div>
  ${pre.length&&S.role==="admin"?`<div class="card warncard"><b>${pre.length} ${pre.length===1?"članarina je":"članarina je"} iz mjeseci prije upisa – to nije dug:</b>

  ${debts.length?`<div class="card"><div class="row"><div class="eyebrow grow">Dugovanja</div><b class="num" style="color:var(--bad)">${debts.reduce((a,d)=>a+d.amt,0)} KM</b></div><div class="list" style="margin-top:4px">${debts.map(d=>li(null,esc(d.k.ime),esc(d.months.join(", ")),`<b class="num">${d.amt} KM</b>`)).join("")}</div></div>`:""}

    let act="";if(p.s==="ceka")act=`<button class="btn sm" onclick="confirmPay('${k.id}','${m}')">Potvrdi uplatu</button>`;
    else if(p.s==="neplaceno"||p.s==="djelimicno")act=`<button class="btn sm" onclick="payForm('${k.id}','${m}')">Evidentiraj uplatu</button><button class="btn ghost sm" onclick="remind('${k.id}','${m}')">Pošalji podsjetnik</button>${p.s==="neplaceno"&&S.role==="admin"?`<button class="btn ghost sm danger" onclick="askDelPay('${k.id}','${m}')">Obriši</button>`:""}`;
    else if(p.s==="placeno")act=`<button class="btn ghost sm" onclick="setPay('${k.id}','${m}',{s:'neplaceno'});render();toast('Uplata poništena')">Poništi</button>`;
    return `<div class="li" style="flex-wrap:wrap"><span class="av">${ini(k.ime)}</span><div class="grow"><b>${esc(k.ime)}</b><div class="small muted">${info}</div></div>${chip(...PAY[p.s])}${act?`<div class="acts" style="flex-basis:100%;padding-left:50px">${act}</div>`:""}</div>`}).join("")||'<div class="li muted">Nema članica u ovom filteru.</div>'}</div></div>
  <p class="small muted">Online plaćanje nije uključeno. Ovdje se evidentira uplata koju je klub primio.</p>`;
};
function askDelPay(id,m){const k=kid(id);ask(`Obrisati članarinu za <b>${esc(k.ime)}</b> za ${ymL(m)}? Neće se računati kao dug.`,"Obriši članarinu",()=>{setPay(id,m,{s:"obrisano"});render();toast("Članarina obrisana")})}
function askRemovePre(){const pre=preUpis();ask(`Ukloniti ${pre.length} neplaćenih članarina iz mjeseci prije upisa? Plaćene članarine se ne diraju.`,"Ukloni ih",()=>{preUpis().forEach(x=>{delete S.pay[x.k.id][x.m]});save();render();toast("Uklonjeno")})}
function confirmPay(id,m){const p=payOf(id,m);setPay(id,m,{s:"placeno",paid:kidFee(kid(id)),d:p.d||iso(today())});render();toast("Uplata potvrđena: "+kid(id).ime)}
function payForm(id,m){const k=kid(id),fee=kidFee(k);
  sheet(`<h2>Evidentiraj uplatu</h2><p class="muted" style="margin:0">${esc(k.ime)} · ${ymL(m)} · članarina ${fee} KM</p>
  <div class="grid2"><label class="f">Uplaćeno (KM)<input id="pA" type="number" min="0" value="${fee}"></label><label class="f">Datum<input id="pD" type="date" value="${iso(today())}"></label></div>
  <button class="btn block" onclick="savePay('${id}','${m}',${fee})">Sačuvaj uplatu</button>`)}
function savePay(id,m,fee){const a=Math.max(0,+$("#pA").value||0);setPay(id,m,a>=fee?{s:"placeno",paid:a,d:$("#pD").value}:a>0?{s:"djelimicno",paid:a,d:$("#pD").value}:{s:"neplaceno"});closeSheet();render();toast(a>=fee?"Uplata evidentirana":"Evidentirana djelimična uplata")}
function remind(id,m){const k=kid(id),p=payOf(id,m),owed=kidFee(k)-(p.s==="djelimicno"?p.paid:0);
  S.notices.unshift({id:uid(),kind:"Članarina",title:"Podsjetnik za "+MJF[+m.split("-")[1]-1].toLowerCase(),body:`Članarina za ${first(k.ime)} (${owed} KM) za ${ymL(m)} još nije evidentirana. Hvala!`,d:iso(today()),from:S.me,tgt:k.rod});save();render();
  toast("Podsjetnik je poslan roditelju u aplikaciji.")}

  const rows=[["groups","Trening grupe i raspored",`${activeGroups().length} grupa · termini po danima`,I.cal],["locs","Lokacije (škole i sale)",`${S.lok.length} lokacija`,I.pin],["oneoff","Jednokratna promjena termina","Pomjeren ili otkazan trening, druga lokacija",I.swap],["att","Evidencija dolazaka","Prisustvo po grupama",I.check],["staff","Treneri i administratori",`${S.staff.filter(x=>x.uloga==="admin").length} admin. · ${S.staff.filter(x=>x.uloga==="trener").length} trenerice`,I.shield],["prices","Cjenovnik članarina","Iznosi i popusti za sestre",I.tag],["seasons","Sezone i arhiva","Takmičenja i rezultati po sezonama",I.archive],["stats","Statistika kluba","Članice, prisustvo, naplata, medalje",I.chart],["export","Izvoz izvještaja u Excel","Članice, uplate, prisustvo, rezultati",I.down]];

};

/* grupe */
function groupsScreen(){
  return `${backBar("Trening grupe")}
  <div class="row"><button class="btn sm" onclick="groupForm()">+ Nova grupa</button><button class="btn ghost sm" onclick="sub({s:'locs'})">Lokacije</button><button class="btn ghost sm" onclick="sub({s:'oneoff'})">Jednokratna promjena</button></div>
  ${S.grupe.filter(g=>!g.arh).map(g=>`<div class="card"><div class="row"><div class="grow"><h3 style="font-size:18px">${esc(g.name)}</h3><div class="small muted">${esc(cjL(g.cijena))}${crow(g.cijena)?" · "+crow(g.cijena).v+" KM":""}${g.dodatni?" · dodatni trening":""} · ${clanica(groupKids(g.id).length)}</div></div><button class="btn ghost sm" onclick="groupForm('${g.id}')">Uredi</button></div>
  <div class="kv" style="margin-top:8px"><div><span>Lokacija</span><b>${esc(gLoc(g))}</b></div><div><span>${gTr(g).length>1?"Trenerice":"Trenerica"}</span><b>${esc(trnL(g).replace(/^treneric[ae] /,""))}</b></div></div>
  <div class="week">${g.days.slice().sort((a,b)=>a[0]-b[0]).map(d=>`<span><b>${SD[d[0]]}</b>${d[1]}–${d[2]}<i>${mins(d[1],d[2])} min · ${esc(lokN(d[3]||g.locId))}</i></span>`).join("")||'<span class="muted">Nema termina</span>'}</div></div>`).join("")}
  ${S.grupe.some(g=>g.arh)?`<div class="eyebrow">Arhivirane grupe</div><div class="card"><div class="list">${S.grupe.filter(g=>g.arh).map(g=>li(null,esc(g.name),esc(cjL(g.cijena)),`<button class="btn ghost sm" onclick="grp('${g.id}').arh=false;save();render()">Vrati</button>`)).join("")}</div></div>`:""}`;
}
function groupForm(id){const g=id?grp(id):{name:"",cijena:S.cfg.cijene.find(c=>c.tip==="clan")?.id,locId:S.lok[0]?.id,trener:null,treneri:[],days:[],dodatni:false};window.__tr=gTr(g).slice();
  const def=g.days[0]?.[3]||g.locId||S.lok[0]?.id;
  const lokOpts=sel=>S.lok.map(l=>`<option value="${l.id}" ${l.id===sel?"selected":""}>${esc(l.name)}</option>`).join("")+'<option value="new">+ Nova škola ili sala</option>';
  sheet(`<h2>${id?"Uredi grupu i termine":"Nova grupa"}</h2>
  <label class="f">Naziv grupe<input id="gN" value="${esc(g.name)}" placeholder="npr. Školski · KSIRC"></label>
  <label class="f">Članarina za ovu grupu<select id="gC">${S.cfg.cijene.filter(c=>c.tip!=="sestre").map(c=>`<option value="${c.id}" ${c.id===g.cijena?"selected":""}>${esc(c.l)} · ${c.v} KM${c.tip==="ostalo"&&c.j?" "+esc(c.j):""}</option>`).join("")}</select></label>
  <div class="f">Ko vodi treninge (može više trenerica)<div class="trn">${S.staff.slice().sort((a,b)=>(a.uloga===b.uloga?a.ime.localeCompare(b.ime,"bs"):a.uloga==="trener"?-1:1)).map(s=>`<label class="checkrow"><input type="checkbox" class="gtr" value="${s.id}" ${window.__tr.includes(s.id)?"checked":""} onchange="trPick(this)"> <span class="grow">${esc(s.ime)} <span class="muted small">· ${s.uloga==="admin"?"administrator":"trenerica"}</span></span><span class="chip pk trmain" data-id="${s.id}" ${window.__tr[0]===s.id?"":"hidden"}>glavna</span></label>`).join("")}</div><span class="small muted" style="font-weight:400">Prva označena je glavna. Svaka označena vidi grupu i vodi prisustvo.</span></div>
  <label class="checkrow"><input type="checkbox" id="gX" ${g.dodatni?"checked":""}> Dodatni trening (članice ga biraju uz svoju grupu)</label>
  <div class="eyebrow">Dani i termini</div>
  <p class="small muted" style="margin:0">Dodirnite dan, pa izaberite termin i školu za taj dan.</p>
  <div class="days">${DAN.map((dn,i)=>{const d=g.days.find(x=>x[0]===i);return `<div class="dayrow ${d?"on":""}" id="dr${i}">
    <label class="checkrow"><input type="checkbox" id="gd${i}" ${d?"checked":""} onchange="this.closest('.dayrow').classList.toggle('on',this.checked)"> <b>${dn}</b></label>
    <div class="dayset"><div class="grid2"><label class="f">Od<input id="gf${i}" type="time" value="${d?d[1]:"19:00"}"></label><label class="f">Do<input id="gt${i}" type="time" value="${d?d[2]:"20:00"}"></label></div>
    <label class="f">Škola / sala<select id="gl${i}" onchange="$('#gnl${i}').hidden=this.value!=='new'">${lokOpts(d?.[3]||def)}</select></label>
    <label class="f" id="gnl${i}" ${S.lok.length?"hidden":""}>Naziv nove lokacije<input id="gnli${i}" placeholder="npr. OŠ Pazarić – sala"></label></div></div>`}).join("")}</div>
  ${id?`<label class="checkrow"><input type="checkbox" id="gNot" checked> Obavijesti roditelje ove grupe o promjeni</label>`:""}
  <p id="fErr" class="err" hidden></p>
  <button class="btn block" onclick="saveGroup('${id||""}')">Sačuvaj</button>
  ${id?`<button class="btn ghost block" onclick="archGroup('${id}')">Arhiviraj grupu</button>`:""}`)}
function saveGroup(id){const n=$("#gN").value.trim();if(!n)return ferr("Upišite naziv grupe.");
  const ds=[],added={};
  for(let i=0;i<7;i++)if($("#gd"+i).checked){const a=$("#gf"+i).value,b=$("#gt"+i).value;if(!a||!b||mins(a,b)<=0)return ferr(DAN[i]+": kraj treninga mora biti poslije početka.");
    let l=$("#gl"+i).value;if(l==="new"){const ln=$("#gnli"+i).value.trim();if(!ln)return ferr(DAN[i]+": upišite naziv nove lokacije.");l=added[ln.toLowerCase()]||(S.lok.find(x=>x.name.toLowerCase()===ln.toLowerCase())?.id);if(!l){l=uid();S.lok.push({id:l,name:ln})}added[ln.toLowerCase()]=l}
    ds.push([i,a,b,l])}
  if(!ds.length)return ferr("Izaberite bar jedan dan treninga.");
  const tr=(window.__tr||[]).filter(x=>stf(x));const d={name:n,cijena:$("#gC").value,trener:tr[0]||null,treneri:tr,locId:ds[0][3],days:ds,dodatni:$("#gX").checked};
  if(id){const g=grp(id);Object.assign(g,d);if($("#gNot")?.checked)S.notices.unshift({id:uid(),kind:"Raspored",title:"Novi raspored: "+n,body:"Od sada: "+ds.map(x=>`${DAN[x[0]].toLowerCase()} ${x[1]}–${x[2]}, ${lokN(x[3])}`).join("; ")+".",d:iso(today()),from:S.me,tgt:id})}
  else S.grupe.push({id:uid(),arh:false,...d});
  save();closeSheet();render();toast(id?"Grupa sačuvana":"Grupa dodana")}
function trPick(cb){const t=window.__tr=window.__tr||[];const i=t.indexOf(cb.value);if(cb.checked&&i<0)t.push(cb.value);if(!cb.checked&&i>=0)t.splice(i,1);
  document.querySelectorAll(".trmain").forEach(x=>x.hidden=x.dataset.id!==t[0])}
function archGroup(id){if(S.kids.some(k=>k.status!=="ispisana"&&k.grupa===id)){ferr("U grupi još ima članica. Prvo ih premjestite u drugu grupu.");return}grp(id).arh=true;save();closeSheet();render();toast("Grupa je arhivirana")}

function locsScreen(){
  return `${backBar("Lokacije (škole i sale)")}

  <div class="card"><div class="list">${S.lok.map(l=>{const n=S.grupe.filter(g=>!g.arh&&usesLoc(g,l.id));return `<div class="li" style="flex-wrap:wrap"><input id="lk_${l.id}" class="inp grow" value="${esc(l.name)}" aria-label="Naziv lokacije" onchange="renLok('${l.id}',this.value)"><button class="btn ghost sm" onclick="delLok('${l.id}')" ${n.length?"disabled":""}>Ukloni</button><div class="small muted" style="flex-basis:100%">${n.length?"Koriste: "+n.map(g=>esc(g.name)).join(", "):"Nijedna grupa ne koristi ovu lokaciju"}</div></div>`}).join("")}</div></div>

function renLok(id,v){v=v.trim();if(!v)return render();S.lok.find(l=>l.id===id).name=v;save();toast("Lokacija sačuvana")}
function addLok(){const v=$("#newLok").value.trim();if(!v)return toast("Upišite naziv lokacije.");S.lok.push({id:uid(),name:v});save();render();toast("Lokacija dodana")}
function delLok(id){S.lok=S.lok.filter(l=>l.id!==id);save();render();toast("Lokacija uklonjena")}

/* jednokratna promjena */
function oneOffScreen(){
  const up=S.izmjene.filter(z=>days(z.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  return `${backBar("Jednokratne promjene")}
  <p class="small muted" style="margin:0">Za jedan dan: pomjeren termin, trening na drugoj lokaciji ili otkazan trening. Redovni raspored ostaje isti, a roditelji grupe dobijaju obavijest.</p>
  <button class="btn" onclick="oneOffForm()">+ Nova promjena</button>
  <div class="card"><div class="eyebrow">Zakazane promjene</div><div class="list" style="margin-top:4px">${up.map(z=>li(null,`${esc(grp(z.g)?.name||"")} · ${DAN[dIdx(z.date)]}, ${fd(z.date)}`,z.type==="cancel"?"Trening otkazan":`${z.od}–${z.do} · ${esc(lokN(z.locId))}`+(z.note?" · "+esc(z.note):""),`<button class="btn ghost sm" onclick="delOneOff('${z.id}')">Poništi</button>`)).join("")||'<div class="li muted">Nema zakazanih promjena.</div>'}</div></div>`;
}
function oneOffForm(){const gs=myGroups();if(!gs.length)return toast("Nema grupa.");const g=gs[0];
  sheet(`<h2>Jednokratna promjena</h2>
  <label class="f">Grupa<select id="oG" onchange="ooHint()">${gs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label>
  <p id="oReg" class="small muted" style="margin:0"></p>
  <label class="f">Šta se mijenja<select id="oT" onchange="ooHint()"><option value="move">Pomjeren termin</option><option value="place">Druga lokacija</option><option value="cancel">Otkazan trening</option></select></label>
  <label class="f">Datum treninga<input id="oD" type="date" value="${nextSession(g)?.date||iso(today())}"></label>
  <div id="oMove" class="stack"><div class="grid2"><label class="f">Od<input id="oF" type="time" value="${g.days[0]?.[1]||"19:00"}"></label><label class="f">Do<input id="oTo" type="time" value="${g.days[0]?.[2]||"20:00"}"></label></div>
  <label class="f">Gdje je trening tog dana<select id="oL" onchange="$('#oNL').hidden=this.value!=='new'">${S.lok.map(l=>`<option value="${l.id}" ${l.id===(g.days[0]?.[3]||g.locId)?"selected":""}>${esc(l.name)}</option>`).join("")}<option value="new">+ Nova lokacija</option></select></label>
  <label class="f" id="oNL" ${S.lok.length?"hidden":""}>Naziv nove lokacije<input id="oNLi"></label></div>
  <label class="f">Napomena za roditelje (nije obavezno)<textarea id="oN" rows="2"></textarea></label>
  <p id="fErr" class="err" hidden></p>
  <button class="btn block" onclick="saveOneOff()">Objavi promjenu</button>`);ooHint()}
function ooHint(){const g=grp($("#oG").value);$("#oReg").textContent="Redovno: "+schedTxt(g)+" · "+gLoc(g)+". Obavijest dobija "+new Set(groupKids(g.id).map(k=>k.rod)).size+" roditelja.";$("#oMove").hidden=$("#oT").value==="cancel"}
function saveOneOff(){const g=$("#oG").value,t=$("#oT").value,d=$("#oD").value;if(!d)return ferr("Izaberite datum.");
  let loc=$("#oL").value;if(t!=="cancel"&&loc==="new"){const n=$("#oNLi").value.trim();if(!n)return ferr("Upišite naziv lokacije.");loc=uid();S.lok.push({id:loc,name:n})}
  const z={id:uid(),g,date:d,type:t,od:$("#oF").value,do:$("#oTo").value,locId:loc,note:$("#oN").value.trim()};
  if(t!=="cancel"&&mins(z.od,z.do)<=0)return ferr("Kraj treninga mora biti poslije početka.");
  S.izmjene=S.izmjene.filter(x=>!(x.g===g&&x.date===d));S.izmjene.push(z);
  const body=t==="cancel"?`Trening grupe ${grp(g).name} u ${DAN[dIdx(d)].toLowerCase()}, ${fd(d)}, je otkazan.`:`Trening grupe ${grp(g).name} u ${DAN[dIdx(d)].toLowerCase()}, ${fd(d)}, je od ${z.od} do ${z.do}, ${lokN(loc)}.`;
  S.notices.unshift({id:uid(),kind:t==="cancel"?"Otkazan trening":"Promjena termina",title:(t==="cancel"?"Otkazan trening ":"Promjena termina ")+fds(d),body:body+(z.note?" "+z.note:""),d:iso(today()),from:S.me,tgt:g});
  save();closeSheet();render();toast("Promjena objavljena roditeljima grupe")}
function delOneOff(id){S.izmjene=S.izmjene.filter(z=>z.id!==id);save();render();toast("Promjena poništena, vrijedi redovni raspored")}

/* izvoz u Excel */
function reportData(t,m){const sz=curSez();
  if(t==="clanice")return[["Ime i prezime","Datum rođenja","Datum upisa","Grupa","Status","Roditelj","Telefon","E-mail","Članarina (KM)"],...S.kids.slice().sort((a,b)=>a.ime.localeCompare(b.ime,"bs")).map(k=>[k.ime,fd(k.dob),fd(k.upis),grp(k.grupa)?.name||"",MST[k.status][0],rodN(k.rod),S.rod[k.rod]?.tel||"",S.rod[k.rod]?.mail||"",k.status==="aktivna"?kidFee(k):0])];
  if(t==="uplate")return[["Ime i prezime","Grupa","Mjesec","Članarina (KM)","Status","Uplaćeno (KM)","Datum"],...S.kids.filter(k=>k.status!=="ispisana"&&owes(k.id,m)).map(k=>{const p=payOf(k.id,m),f=kidFee(k);return[k.ime,grp(k.grupa)?.name||"",ymL(m),f,PAY[p.s][0],p.s==="placeno"?f:p.s==="djelimicno"?p.paid:0,fd(p.d)]})];
  if(t==="prisustvo")return[["Ime i prezime","Grupa","Prisutna","Opravdano","Izostala","Prisustvo %"],...S.kids.filter(k=>k.status!=="ispisana").map(k=>{const a={p:0,o:0,n:0};Object.entries(S.att).forEach(([key,v])=>{if(v[k.id]&&sez(key.slice(0,10))===sz)a[v[k.id]]++});const t=a.p+a.o+a.n;return[k.ime,grp(k.grupa)?.name||"",a.p,a.o,a.n,t?Math.round(a.p/t*100)+"%":"–"]})];
  if(t==="rezultati")return[["Datum","Takmičenje","Mjesto","Ime i prezime","Kategorija","Rekvizit","Ocjena","Plasman"],...S.results.map(r=>({r,e:S.events.find(e=>e.id===r.eventId)})).filter(x=>x.e&&sez(x.e.datum)===sz).sort((a,b)=>a.e.datum.localeCompare(b.e.datum)||a.r.plasman-b.r.plasman).map(({r,e})=>[fd(e.datum),e.naziv,e.mjesto,kid(r.kidId)?.ime||"",r.kategorija,r.rekvizit,r.ocjena.toFixed(3).replace(".",","),r.plasman])];
  return[]}

function statsScreen(){const sz=curSez();const act=S.kids.filter(k=>k.status==="aktivna");
  const gRows=activeGroups().map(g=>{let p=0,t=0;Object.entries(S.att).forEach(([key,v])=>{if(key.endsWith("|"+g.id)&&sez(key.slice(0,10))===sz)Object.values(v).forEach(x=>{t++;if(x==="p")p++})});return{g,n:groupKids(g.id).filter(k=>k.status==="aktivna").length,pct:t?Math.round(p/t*100):null}});
  const maxN=Math.max(1,...gRows.map(r=>r.n));
  const months=sezMonths(sz).filter(m=>m<=ym()).map(m=>{let e=0,c=0;act.forEach(k=>{const f=kidFee(k),p=payOf(k.id,m);if(NOPAY[p.s])return;e+=f;if(p.s==="placeno")c+=f;if(p.s==="djelimicno")c+=p.paid||0});return{m,e,c}});
  const evs=S.events.filter(e=>sez(e.datum)===sz),rs=S.results.filter(r=>evs.some(e=>e.id===r.eventId));const med=n=>rs.filter(r=>r.plasman===n).length;
  const newK=S.kids.filter(k=>k.upis&&sez(k.upis)===sz).length;
  return `${backBar("Statistika kluba")}<p class="small muted" style="margin:0">Sezona ${sz}</p>
  <div class="tiles">${[[act.length,"Aktivne članice",""],[newK,"Novih ove sezone","pk"],[S.kids.filter(k=>k.status==="pauza").length,"Na pauzi","warn"]].map(([v,l,c])=>`<div class="tile ${c}"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
  <div class="card"><div class="eyebrow">Članice i prisustvo po grupi</div><div class="stack" style="margin-top:8px">${gRows.map(r=>`<div><div class="row small"><b class="grow">${esc(r.g.name)}</b><span class="muted">${clanica(r.n)}${r.pct!==null?` · prisustvo ${r.pct}%`:""}</span></div><div class="bar thin"><div style="width:${r.n/maxN*100}%;background:var(--accent)"></div></div></div>`).join("")}</div></div>
  <div class="card"><div class="eyebrow">Naplata članarina</div><div class="stack" style="margin-top:8px">${months.map(x=>`<div><div class="row small"><b class="grow">${MJF[+x.m.split("-")[1]-1]}</b><span class="num">${x.c} / ${x.e} KM</span></div><div class="bar thin"><div style="width:${x.e?Math.min(100,x.c/x.e*100):0}%"></div></div></div>`).join("")}</div></div>
  <div class="card"><div class="eyebrow">Takmičenja</div><div class="count"><div><b>${evs.length}</b><span>takmičenja</span></div><div><b>${rs.length}</b><span>nastupa</span></div></div>
  <div class="medals" style="margin-top:10px;justify-content:center">${[1,2,3].map(n=>`<div><span class="medal m${n}">${n}.</span>× ${med(n)}</div>`).join("")}</div></div>`}

function staffForm(id){const s=id?stf(id):{ime:"",mail:"",tel:"",uloga:"trener"};
  sheet(`<h2>${id?"Uredi osobu":"Nova osoba u klubu"}</h2>

  <div class="grid2"><label class="f">E-mail${id?"":" (za prijavu)"}<input id="sM" type="email" value="${esc(s.mail)}" ${id?"disabled":""}></label><label class="f">Telefon<input id="sT" type="tel" value="${esc(s.tel)}"></label></div>
  <label class="f">Uloga<select id="sU"><option value="admin" ${s.uloga==="admin"?"selected":""}>Administrator – vidi i mijenja sve</option><option value="trener" ${s.uloga==="trener"?"selected":""}>Trenerica – svoje grupe</option></select></label>

function saveStaff(id){const n=$("#sI").value.trim();if(!n)return ferr("Upišite ime i prezime.");const u=$("#sU").value;
  if(id&&stf(id).uloga==="admin"&&u!=="admin"&&S.staff.filter(x=>x.uloga==="admin").length<2)return ferr("Klub mora imati bar jednog administratora.");
  if(id){Object.assign(stf(id),{ime:n,tel:$("#sT").value.trim(),uloga:u});save();closeSheet();render();toast("Sačuvano");return}
  const m=$("#sM").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m))return ferr("Upišite ispravan e-mail.");
  if(S.staff.some(x=>x.mail===m)||S.inv[m])return ferr("Ovaj e-mail je već dodan.");

function pricesScreen(){const c=S.cfg;

    <button class="btn ghost sm" onclick="delCijena('${x.id}')" aria-label="Obriši red">Obriši</button></div></div>`;
  return `${backBar("Cjenovnik članarina")}
  <p class="small muted" style="margin:0">Dodajte ili obrišite redova koliko želite. Svakoj grupi zatim izaberete koja članarina vrijedi.</p>
  ${["clan","sestre","ostalo"].map(t=>`<div class="card stack"><div class="eyebrow">${TIP[t]}</div>
  ${t==="sestre"?`<p class="small muted" style="margin:0">Ako roditelj ima dvije djevojčice na istom računu, plaća ovaj ukupan iznos. Prvo dijete plaća svoju punu cijenu, drugo razliku.</p>`:""}
  ${c.cijene.filter(x=>x.tip===t).map(row).join("")||'<p class="small muted" style="margin:0">Nema redova.</p>'}
  <button class="btn ghost sm" style="align-self:flex-start" onclick="addCijena('${t}')">+ Dodaj red</button></div>`).join("")}
  <div class="card stack"><label class="f">Napomena ispod cjenovnika<input id="c_nap" value="${esc(c.napomena)}"></label></div>
  <button class="btn block" onclick="saveCijene()">Sačuvaj cjenovnik</button>`}
function readCijene(){S.cfg.cijene.forEach(x=>{const g=k=>$(`#c_${k}_${x.id}`);if(!g("l"))return;x.l=g("l").value.trim()||x.l;x.v=Math.max(0,+g("v").value||0);if(g("a")){x.a=g("a").value;x.b=g("b").value}if(g("j"))x.j=g("j").value.trim()});const n=$("#c_nap");if(n)S.cfg.napomena=n.value.trim()}
function saveCijene(){readCijene();save();render();toast("Cjenovnik sačuvan")}
function addCijena(t){readCijene();const clan=S.cfg.cijene.find(x=>x.tip==="clan")?.id;
  if(t==="sestre"&&!clan)return toast("Prvo dodajte bar jednu mjesečnu članarinu po djetetu.");
  S.cfg.cijene.push({id:uid(),tip:t,l:t==="clan"?"Nova članarina":t==="sestre"?"Dvije sestre":"Nova stavka",v:0,...(t==="sestre"?{a:clan,b:clan}:{}),...(t==="ostalo"?{j:""}:{})});save();render();
  const last=S.cfg.cijene.at(-1);setTimeout(()=>{const i=$("#c_l_"+last.id);i?.focus();i?.select()},30)}
function delCijena(id){readCijene();const gs=S.grupe.filter(g=>!g.arh&&g.cijena===id);
  if(gs.length)return toast("Ovu članarinu koristi grupa "+gs[0].name+". Prvo grupi izaberite drugu.");
  if(S.kids.some(k=>k.cijena===id))return toast("Ovu članarinu ima neka članica posebno postavljenu. Prvo je promijenite kod članice.");
  if(S.cfg.cijene.some(c=>c.tip==="sestre"&&(c.a===id||c.b===id)))return toast("Ovu članarinu koristi red za sestre. Prvo njega promijenite ili obrišite.");
  S.cfg.cijene=S.cfg.cijene.filter(c=>c.id!==id);save();render();toast("Red obrisan")}

function evStatus(e){const end=e.datumDo||e.datum;
  if(days(end)<0)return{k:"past",h:chip("Završeno","n")};
  const p=days(e.prijavaDo);if(p<0)return{k:"closed",h:chip("Prijave zatvorene","warn")};

function dateBox(e){const d=pd(e.datum),past=days(e.datumDo||e.datum)<0;const dd=e.datumDo?d.getDate()+"–"+pd(e.datumDo).getDate():d.getDate();

function sezSel(withAll){const v=view.sz||curSez();

function calScreen(){
  if(view.sz==="sve")view.sz=curSez();
  const sz=view.sz||curSez(),arch=sz!==curSez();
  const evs=S.events.filter(e=>sez(e.datum)===sz).sort((a,b)=>a.datum.localeCompare(b.datum));
  const up=evs.filter(e=>evStatus(e).k!=="past"),past=evs.filter(e=>evStatus(e).k==="past").reverse();
  const card=e=>{const st=evStatus(e);let acts="";
    if(S.role==="clanica"){const k=curKid(),on=k&&e.prijave.includes(k.id);acts=on?chip("Prijavljena si","pk"):!canEnter(e,k)?chip("Samo za pozvane članice","n"):st.k==="open"?chip("Prijavu radi roditelj","n"):""}
    else if(S.role==="roditelj"){acts=myKids().map(k=>{const on=e.prijave.includes(k.id);if(!canEnter(e,k))return on?chip(first(k.ime)+" prijavljena","pk"):chip(first(k.ime)+": samo za pozvane članice","n");
        const paid=on&&(e.placeno||[]).includes(k.id),kc=on&&e.kotizacija?chip(first(k.ime)+": kotizacija "+(paid?"plaćena ✓":"nije plaćena"),paid?"ok":"warn"):"";
        if(st.k==="open"&&!paid)return `<button class="btn sm ${on?"ghost":""}" onclick="togPrijava('${e.id}','${k.id}')">${on?"✓ "+esc(first(k.ime))+" prijavljena · Odjavi":"Prijavi "+esc(first(k.ime))}</button>${kc}`;
        if(on)return chip(first(k.ime)+" prijavljena","pk")+kc;

    else acts=`${chip(e.pozvane?"Pozvane: "+clanica(e.pozvane.length):"Mogu sve članice",e.pozvane?"pk":"n")}<button class="btn ghost sm" onclick="prijaveForm('${e.id}')">Prijavljene (${e.prijave.length})</button>${e.kotizacija&&e.prijave.length?`<button class="btn ghost sm" onclick="kotizForm('${e.id}')">💳 Kotizacije ${(e.placeno||[]).filter(k=>e.prijave.includes(k)).length}/${e.prijave.length}</button>`:""}${S.role==="admin"?`<button class="btn ghost sm" onclick="eventForm('${e.id}')">Uredi</button>`:""}`;
    if(st.k==="past")acts+=`<button class="btn sm" onclick="view={seg:'res',mode:'ev',ev:'${e.id}',sz:'${sez(e.datum)}'};render()">Rezultati</button>`;
    return `<div class="card ev">${dateBox(e)}<div class="grow"><h3>${esc(e.naziv)}</h3><div class="meta"><span>${esc(e.mjesto)}</span><span>Prijava do ${fd(e.prijavaDo)}</span><span>Kotizacija ${e.kotizacija?e.kotizacija+" KM":"–"}</span></div><div style="margin-top:6px">${st.h}</div><div class="acts">${acts}</div></div></div>`};
  return `<div class="sec-h"><h2>Kalendar takmičenja</h2>${S.role==="admin"?`<button class="btn sm" onclick="eventForm()">+ Dodaj</button>`:""}</div>
  ${sezSel(false)}

function resScreen(){
  const mode=view.mode||(isFam()?"kid":"ev");const sz=view.sz||curSez();
  const ev=id=>S.events.find(e=>e.id===id);

    <div class="card"><div class="list">${pool.filter(r=>r.eventId===evId).sort((a,b)=>a.plasman-b.plasman).map(resRow).join("")}</div></div>`:'<div class="card muted">Za ovu sezonu još nema rezultata.</div>';
  } else {
    const ks=isFam()?myKids():S.kids.filter(k=>vis.some(r=>r.kidId===k.id)).sort((a,b)=>a.ime.localeCompare(b.ime,"bs"));
    const kId=view.kid&&ks.some(k=>k.id===view.kid)?view.kid:ks[0]?.id;
    const rs=pool.filter(r=>r.kidId===kId).sort((a,b)=>ev(b.eventId).datum.localeCompare(ev(a.eventId).datum));
    const c=n=>rs.filter(r=>r.plasman===n).length;const best=rs.length?Math.max(...rs.map(r=>r.ocjena)):0;
    body=`${isFam()?ks.length<2?"":`<div class="seg">${ks.map(k=>`<button class="${k.id===kId?"on":""}" onclick="view.kid='${k.id}';render()">${esc(first(k.ime))}</button>`).join("")}</div>`
      :`<label class="f">Gimnastičarka<select id="selK" onchange="view.kid=this.value;render()">${ks.map(k=>`<option value="${k.id}" ${k.id===kId?"selected":""}>${esc(k.ime)}</option>`).join("")}</select></label>`}
    ${kId?`<div class="card"><div class="row"><span class="av big">${ini(kid(kId).ime)}</span><div class="grow"><h3 style="font-size:19px">${esc(kid(kId).ime)}</h3><div class="small muted">${esc(grp(kid(kId).grupa)?.name||"")} · godište ${kid(kId).dob.slice(0,4)}</div></div></div>
    <div class="eyebrow" style="margin-top:12px;text-align:center">${sz==="sve"?"Sve sezone":"Sezona "+sz}</div>
    <div class="count" style="margin-top:6px"><div><b>${rs.length}</b><span>nastupa</span></div><div><b>${best?best.toFixed(3):"–"}</b><span>najbolja ocjena</span></div></div>
    <div class="medals" style="margin-top:10px;justify-content:center">${[1,2,3].map(n=>`<div><span class="medal m${n}">${n}.</span>× ${c(n)}</div>`).join("")}</div></div>
    <div class="card"><div class="list">${rs.map(r=>{const e=ev(r.eventId);return `<div class="li"><span class="medal ${r.plasman<=3?"m"+r.plasman:"mx"}">${r.plasman}.</span><div class="grow"><b>${esc(e.naziv)}</b><div class="small muted">${fd(e.datum)} · ${esc(r.kategorija)} · ${esc(r.rekvizit)}</div></div><span class="score">${r.ocjena.toFixed(3)}</span></div>`}).join("")||'<div class="li muted">Nema nastupa u ovoj sezoni.</div>'}</div></div>`:'<div class="card muted">Još nema rezultata.</div>'}`;
  }
  return `<div class="sec-h"><h2>Rezultati</h2>${isStaff()?`<button class="btn sm" onclick="resForm()">+ Unesi</button>`:""}</div>
  ${sezSel(true)}
  <div class="seg"><button class="${mode==="ev"?"on":""}" onclick="view={seg:'res',mode:'ev',sz:'${sz}'};render()">Po takmičenju</button><button class="${mode==="kid"?"on":""}" onclick="view={seg:'res',mode:'kid',sz:'${sz}'};render()">${S.role==="clanica"?"Moji rezultati":S.role==="roditelj"?"Moja djeca":"Po djetetu"}</button></div>${body}`;
}
function resRow(r){const k=kid(r.kidId);return `<div class="li"><span class="medal ${r.plasman<=3?"m"+r.plasman:"mx"}">${r.plasman}.</span><div class="grow"><b>${esc(k?.ime)}</b><div class="small muted">${esc(r.kategorija)} · ${esc(r.rekvizit)}</div></div><span class="score">${r.ocjena.toFixed(3)}</span>${isStaff()?`<button class="btn ghost sm" onclick="delRes('${r.id}')" aria-label="Obriši rezultat">✕</button>`:""}</div>`}
function delRes(id){S.results=S.results.filter(r=>r.id!==id);save();render();toast("Rezultat obrisan")}
function eventForm(id){const e=S.events.find(x=>x.id===id)||{datum:"",prijavaDo:"",naziv:"",mjesto:"",kotizacija:60};
  sheet(`<h2>${id?"Uredi takmičenje":"Novo takmičenje"}</h2>
  <label class="f">Naziv<input id="fN" value="${esc(e.naziv)}" placeholder="npr. Međunarodni turnir „Ritam Cup“"></label>
  <label class="f">Mjesto<input id="fM" value="${esc(e.mjesto)}"></label>
  <div class="grid2"><label class="f">Datum<input id="fD" type="date" value="${e.datum}"></label><label class="f">Do (ako traje 2 dana)<input id="fD2" type="date" value="${e.datumDo||""}"></label></div>
  <div class="grid2"><label class="f">Prijava do<input id="fP" type="date" value="${e.prijavaDo}"></label><label class="f">Kotizacija (KM)<input id="fK" type="number" min="0" value="${e.kotizacija}"></label></div>
  <div class="eyebrow">Ko se može prijaviti</div>
  <div class="seg"><button id="pzAll" class="${e.pozvane?"":"on"}" onclick="pzMode(false)">Sve članice</button><button id="pzSel" class="${e.pozvane?"on":""}" onclick="pzMode(true)">Samo izabrane</button></div>
  <div id="pzBox" class="stack" ${e.pozvane?"":"hidden"}>
    <div class="small muted">Brzi izbor (dodaje u listu):</div>
    <div class="chips wrap">${activeGroups().map(g=>`<button onclick="pzGroup('${g.id}')">+ ${esc(g.name)}</button>`).join("")}<button onclick="pzSet(()=>false)">Očisti sve</button></div>
    <div class="row"><label class="f grow">Godište od<input id="pzOd" type="number" inputmode="numeric" placeholder="2014"></label><label class="f grow">do<input id="pzDo" type="number" inputmode="numeric" placeholder="2017"></label><button class="btn ghost sm" style="align-self:flex-end" onclick="pzYear()">Označi</button></div>
    <div class="list pzlist">${S.kids.filter(k=>k.status!=="ispisana").sort((a,b)=>a.ime.localeCompare(b.ime,"bs")).map(k=>`<label class="li" style="cursor:pointer"><span class="grow"><b>${esc(k.ime)}</b><span class="small muted" style="display:block">${esc(grp(k.grupa)?.name||"")} · ${k.dob.slice(0,4)}${k.status==="pauza"?" · pauza":""}</span></span><input type="checkbox" class="pz" data-k="${k.id}" data-g="${k.grupa}" data-y="${k.dob.slice(0,4)}" ${e.pozvane?.includes(k.id)?"checked":""} onchange="pzCount()" style="width:22px;height:22px;accent-color:var(--accent)"></label>`).join("")}</div>
    <p id="pzN" class="small" style="margin:0;font-weight:700"></p></div>
  ${id?"":`<label class="checkrow"><input type="checkbox" id="fNot" checked> <span id="fNotL">Pošalji obavijest svim roditeljima</span></label>`}
  <p id="fErr" class="err" hidden></p>
  <button class="btn block" onclick="saveEvent('${id||""}')">Sačuvaj</button>
  ${id?`<button class="btn ghost block" onclick="this.hidden=true;this.nextElementSibling.hidden=false">Obriši takmičenje</button><button class="btn block" hidden style="background:var(--bad);color:#fff" onclick="delEvent('${id}')">Da, obriši takmičenje i njegove rezultate</button>`:""}`)}
function saveEvent(id){const v=x=>$(x).value.trim();
  if(!v("#fN")||!v("#fD")||!v("#fP"))return ferr("Upišite naziv, datum i rok za prijavu.");
  const sel=!$("#pzBox").hidden,poz=sel?[...document.querySelectorAll(".pz:checked")].map(c=>c.dataset.k):null;
  if(sel&&!poz.length)return ferr("Izaberite bar jednu članicu koja se može prijaviti.");
  const d={naziv:v("#fN"),mjesto:v("#fM"),datum:v("#fD"),datumDo:v("#fD2")||undefined,prijavaDo:v("#fP"),kotizacija:+v("#fK")||0,pozvane:poz};
  if(id){const e=S.events.find(x=>x.id===id);Object.assign(e,d);if(poz)e.prijave=e.prijave.filter(k=>poz.includes(k))}else{const eid=uid();S.events.push({id:eid,prijave:[],...d});
    if($("#fNot")?.checked)S.notices.unshift({id:uid(),kind:"Takmičenje",title:d.naziv,body:`${fd(d.datum)}${d.mjesto?", "+d.mjesto:""}. Prijave do ${fd(d.prijavaDo)}${d.kotizacija?", kotizacija "+d.kotizacija+" KM":""}. Prijavite dijete u aplikaciji, u dijelu Takmičenja.`,d:iso(today()),from:S.me,tgt:poz?"ev:"+eid:"all"})}
  save();closeSheet();render();toast("Takmičenje sačuvano")}
function pzMode(on){$("#pzBox").hidden=!on;$("#pzAll").classList.toggle("on",!on);$("#pzSel").classList.toggle("on",on);pzCount()}
function pzSet(f){document.querySelectorAll(".pz").forEach(c=>c.checked=f(c));pzCount()}
function pzGroup(g){document.querySelectorAll(".pz").forEach(c=>{if(c.dataset.g===g)c.checked=true});pzCount()}
function pzYear(){const a=+$("#pzOd").value||0,b=+$("#pzDo").value||9999;document.querySelectorAll(".pz").forEach(c=>{const y=+c.dataset.y;if(y>=a&&y<=b)c.checked=true});pzCount()}
function pzCount(){const sel=!$("#pzBox").hidden,n=document.querySelectorAll(".pz:checked").length;$("#pzN").textContent="Izabrano: "+clanica(n);
  const l=$("#fNotL");if(l)l.textContent=sel?"Pošalji obavijest samo roditeljima izabranih članica":"Pošalji obavijest svim roditeljima"}
function delEvent(id){S.events=S.events.filter(e=>e.id!==id);S.results=S.results.filter(r=>r.eventId!==id);save();closeSheet();render();toast("Takmičenje obrisano")}
function prijaveForm(id){const e=S.events.find(x=>x.id===id);const ks=S.kids.filter(k=>k.status!=="ispisana"&&canEnter(e,k)&&(S.role==="admin"||myGroups().some(g=>g.id===k.grupa)));
  sheet(`<h2>Prijavljene</h2><p class="muted small" style="margin:0">${esc(e.naziv)} · ${e.prijave.length} prijavljenih${e.kotizacija?` · ukupno kotizacija ${e.prijave.length*e.kotizacija} KM`:""}</p>
  <div class="list">${ks.map(k=>`<label class="li" style="cursor:pointer"><span class="av">${ini(k.ime)}</span><span class="grow"><b>${esc(k.ime)}</b><span class="small muted" style="display:block">${esc(grp(k.grupa)?.name||"")} · ${k.dob.slice(0,4)}</span></span><input type="checkbox" id="p_${k.id}" ${e.prijave.includes(k.id)?"checked":""} style="width:22px;height:22px;accent-color:var(--accent)"></label>`).join("")}</div>
  <button class="btn block" onclick="savePrijave('${id}')">Sačuvaj prijave</button>`)}
function kotizForm(id){const e=S.events.find(x=>x.id===id);e.placeno=e.placeno||[];
  const ks=e.prijave.map(kid).filter(Boolean).sort((a,b)=>a.ime.localeCompare(b.ime,"bs"));const paid=ks.filter(k=>e.placeno.includes(k.id));
  sheet(`<h2>Kotizacije</h2><p class="muted small" style="margin:0">${esc(e.naziv)} · ${e.kotizacija} KM po djetetu</p>
  <div class="card"><div class="row" style="align-items:baseline"><span class="score" style="font-size:26px">${paid.length*e.kotizacija} KM</span><span class="muted">od ${ks.length*e.kotizacija} KM · platilo ${paid.length} od ${ks.length}</span></div>
  <div class="bar"><div style="width:${ks.length?paid.length/ks.length*100:0}%"></div></div></div>
  <p class="small muted" style="margin:0">Dodirnite dugme da označite ko je platio. Roditelj vidi status, ali ga ne može mijenjati.</p>
  <div class="list">${ks.map(k=>{const on=e.placeno.includes(k.id);return `<div class="li"><span class="av">${ini(k.ime)}</span><span class="grow"><b>${esc(k.ime)}</b><span class="small muted" style="display:block">${esc(rodN(k.rod))}</span></span><button class="btn sm ${on?"":"ghost"}" style="${on?"background:var(--ok);color:#fff":""}" onclick="togKotiz('${id}','${k.id}')">${on?"✓ Plaćeno":"Nije plaćeno"}</button></div>`}).join("")||'<div class="li muted">Još niko nije prijavljen.</div>'}</div>
  <button class="btn ghost block" onclick="closeSheet()">Zatvori</button>`)}
function togKotiz(id,k){const e=S.events.find(x=>x.id===id);e.placeno=e.placeno||[];const i=e.placeno.indexOf(k);i>=0?e.placeno.splice(i,1):e.placeno.push(k);save();render();kotizForm(id)}
function savePrijave(id){const e=S.events.find(x=>x.id===id);S.kids.forEach(k=>{const c=$("#p_"+k.id);if(!c)return;const i=e.prijave.indexOf(k.id);if(c.checked&&i<0)e.prijave.push(k.id);if(!c.checked&&i>=0)e.prijave.splice(i,1)});e.placeno=(e.placeno||[]).filter(k=>e.prijave.includes(k));save();closeSheet();render();toast("Prijave sačuvane")}
function resForm(){const evs=S.events.filter(e=>days(e.datum)<=0).sort((a,b)=>b.datum.localeCompare(a.datum));
  if(!evs.length)return toast("Rezultati se unose nakon takmičenja");
  sheet(`<h2>Unesi rezultat</h2>
  <label class="f">Takmičenje<select id="rE" onchange="fillRK()">${evs.map(e=>`<option value="${e.id}">${esc(e.naziv)} · ${fd(e.datum)}</option>`).join("")}</select></label>
  <label class="f">Gimnastičarka<select id="rK"></select></label>
  <div class="grid2"><label class="f">Kategorija<input id="rC" placeholder="npr. Djevojčice 2016"></label>
  <label class="f">Rekvizit<select id="rR">${["Bez rekvizita","Vijača","Obruč","Lopta","Čunjevi","Traka","Višeboj"].map(x=>`<option>${x}</option>`).join("")}</select></label></div>
  <div class="grid2"><label class="f">Ocjena<input id="rO" type="text" inputmode="decimal" autocomplete="off" placeholder="9,450"></label><label class="f">Plasman<input id="rP" type="number" min="1" inputmode="numeric" placeholder="1"></label></div>
  <p id="fErr" class="err" hidden></p>
  <button class="btn block" onclick="saveRes(false)">Sačuvaj rezultat</button><button class="btn ghost block" onclick="saveRes(true)">Sačuvaj i unesi sljedeću</button>`);fillRK()}
function fillRK(){const e=S.events.find(x=>x.id===$("#rE").value);let ks=e.prijave.length?e.prijave.map(kid).filter(Boolean):S.kids.filter(k=>k.status!=="ispisana"&&canEnter(e,k));
  if(S.role==="trener")ks=ks.filter(k=>myGroups().some(g=>g.id===k.grupa));
  $("#rK").innerHTML=ks.map(k=>`<option value="${k.id}">${esc(k.ime)}</option>`).join("");$("#rK").onchange=()=>{const k=kid($("#rK").value);if(k)$("#rC").value="Djevojčice "+k.dob.slice(0,4)};$("#rK").onchange()}
function saveRes(more){const o=parseFloat(String($("#rO").value).trim().replace(",",".")),p=parseInt($("#rP").value);
  if(!isNaN(o)&&(o<0||o>40))return ferr("Ocjena izgleda pogrešno. Primjer: 9,450");
  if(isNaN(o)||isNaN(p)||!$("#rK").value)return ferr("Upišite ocjenu i plasman.");
  S.results.push({id:uid(),eventId:$("#rE").value,kidId:$("#rK").value,kategorija:$("#rC").value.trim()||"–",rekvizit:$("#rR").value,ocjena:o,plasman:p});save();
  if(more){toast("Sačuvano: "+first(kid($("#rK").value).ime));const s=$("#rK");if(s.selectedIndex<s.options.length-1){s.selectedIndex++;s.onchange()}$("#rO").value="";$("#rP").value="";$("#fErr").hidden=true;return}
  view={seg:"res",mode:"ev",ev:$("#rE").value,sz:sez(S.events.find(e=>e.id===$("#rE").value).datum)};closeSheet();render();toast("Rezultat sačuvan · roditelj ga sada vidi")}

/* ---------- donji list (sheet) ---------- */
function sheet(html){closeSheet();const s=document.createElement("div");s.className="scrim";s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><button class="x" onclick="closeSheet()" aria-label="Zatvori">✕</button>${html}</div>`;s.onclick=e=>{if(e.target===s)s.remove()};document.body.appendChild(s);setTimeout(()=>s.querySelector("input:not([type=hidden]),select")?.focus({preventScroll:true}),50);return s}
function ask(html,label,fn){window.__ask=fn;sheet(`<h2>Da li ste sigurni?</h2><p style="margin:0;line-height:1.5">${html}</p><button class="btn block" style="background:var(--bad);color:#fff" onclick="const f=window.__ask;window.__ask=null;closeSheet();f&&f()">${label}</button><button class="btn ghost block" onclick="closeSheet()">Odustani</button>`)}
function closeSheet(){document.querySelector(".scrim")?.remove()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});



boot();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
