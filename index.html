<style>
/* Layout: phone app shell — sticky header, scrolling screen, fixed bottom tab bar; logo pink ring + magenta ribbon drive the palette */

  --ok:#5FD195; --ok-soft:#173525; --warn:#F0B755; --warn-soft:#3A2B12; --bad:#FF8A93; --bad-soft:#3E1A1F;
  --gold:#E8B53C; --silver:#B9C0C8; --bronze:#D58D57; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

/* tab bar */

.ev{display:flex;gap:12px}

.tbl{overflow-x:auto}

td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}

.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}.mx{background:var(--sunk);color:var(--muted)}

const ORDER=["lokacije","cijene","postavke","profili","grupe","grupe_treneri","termini","clanice","clanice_napomene","clanice_dodatne","pozivnice","uplate","prisustvo","izmjene","takmicenja","prijave","rezultati","obavijesti"];
const NOINS={profili:1,postavke:1};
function match(t,r){const ks=PK[t]||["id"];const o={};ks.forEach(k=>o[k]=r[k]);return o}

function save(){
  if(!base||loading)return true;
  const cur=rowsFromS(),ops=[];
  ORDER.forEach(t=>{const a=base[t]||{},b=cur[t]||{};
    Object.keys(b).forEach(k=>{if(!a[k]){if(!NOINS[t])ops.push({t,op:"ins",r:b[k]})}else if(JSON.stringify(a[k])!==JSON.stringify(b[k]))ops.push({t,op:"upd",r:b[k]})})});
  ORDER.slice().reverse().forEach(t=>{const a=base[t]||{},b=cur[t]||{};
    Object.keys(a).forEach(k=>{if(!b[k])ops.push({t,op:"del",r:a[k]})})});
  base=cur;
  if(!ops.length)return true;
  const doOps=async()=>{
    // brisanja termina idu prije upisa (da se dan može premjestiti)
    for(const o of ops.filter(o=>o.op==="del"&&o.t==="termini"))await q(sb.from(o.t).delete().match(match(o.t,o.r)));
    for(const o of ops.filter(o=>o.op!=="del")){
      if(o.op==="ins"){const r={...o.r};if(o.t==="prijave")r.prijavio=S.me;await tolerant(r,x=>sb.from(o.t).insert(x))}
      else if(o.t==="profili")await q(sb.from("profili").update({ime:o.r.ime,telefon:o.r.telefon,uloga:o.r.uloga}).eq("id",o.r.id));
      else await tolerant({...o.r},x=>sb.from(o.t).update(x).match(match(o.t,o.r)));
    }
    for(const o of ops.filter(o=>o.op==="del"&&o.t!=="termini")){
      if(o.t==="profili")await q(sb.from("profili").update({aktivan:false}).eq("id",o.r.id));
      else if(o.t!=="postavke")await q(sb.from(o.t).delete().match(match(o.t,o.r)));
    }
  };
  syncQ=syncQ.then(doOps).then(()=>setNet(true)).catch(async e=>{console.error(e);
    toast(netMsg(e));try{await loadAll();render()}catch(x){}});
  return true;
}
function netMsg(e){const m=String(e?.message||e||"");
  if(/row-level security|permission|42501/i.test(m))return"Nemate dozvolu za ovu promjenu. Podaci su osvježeni.";
  if(/fetch|network|Failed/i.test(m)){setNet(false);return"Nema interneta. Promjena nije sačuvana."}
  if(/duplicate|23505/i.test(m))return"Ovo već postoji. Podaci su osvježeni.";
  if(/foreign key|23503/i.test(m))return"Ovo se koristi na drugom mjestu pa se ne može obrisati.";
  return"Promjena nije sačuvana: "+m.slice(0,80)}

};
const DAN=["Ponedjeljak","Utorak","Srijeda","Četvrtak","Petak","Subota","Nedjelja"];
const SD=["Pon","Uto","Sri","Čet","Pet","Sub","Ned"];
const MJ=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const MJF=["Januar","Februar","Mart","April","Maj","Juni","Juli","August","Septembar","Oktobar","Novembar","Decembar"];
const UZ={pred:"Predškolski uzrast",skol:"Školski uzrast"};
const PAY={placeno:["Plaćeno","ok"],neplaceno:["Nije plaćeno","bad"],ceka:["Čeka potvrdu","warn"],djelimicno:["Djelimično","info"],pauza:["Pauza","n"],prije:["Prije upisa","n"],van:["Ne računa se","n"],obrisano:["Obrisana","n"]};
const MST={aktivna:["Aktivna","ok"],pauza:["Pauza","warn"],ispisana:["Ispisana","n"]};
const ATT={p:["Prisutna","ok"],o:["Opravdano","warn"],n:["Izostala","bad"]};

/* ---------- datumi ---------- */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>{if(!s)return"";const d=pd(s);return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear()+"."};
const fds=s=>{const d=pd(s);return d.getDate()+"."+(d.getMonth()+1)+"."};
const days=s=>Math.round((pd(s)-today())/864e5);
const dIdx=s=>(pd(s).getDay()+6)%7;
const ym=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const ymL=m=>{const[y,mm]=m.split("-");return MJF[+mm-1]+" "+y+"."};
const sez=d=>{const[y,m]=d.split("-").map(Number);return m>=9?`${y}/${y+1}`:`${y-1}/${y}`};
const curSez=()=>sez(iso(today()));
function sezMonths(sz){const y=+sz.split("/")[0],out=[];for(let i=0;i<12;i++){const m=8+i;out.push((y+Math.floor(m/12))+"-"+String(m%12+1).padStart(2,"0"))}return out}
const mins=(a,b)=>{const p=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};return p(b)-p(a)};
const nowStamp=()=>{const d=new Date();return iso(d)+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};

/* ---------- stanje ---------- */
const uid=()=>crypto.randomUUID();
let S={role:null,me:null,meKid:null,lok:[],staff:[],grupe:[],rod:{},kids:[],pay:{},events:[],results:[],notices:[],threads:{},cfg:{cijene:[],napomena:""},att:{},izmjene:[],seen:{},inv:{}};
let PARENT=null;
let tab=null,view={};

/* ---------- pomoćne ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini=n=>String(n).split(" ").filter(Boolean).map(x=>x[0]).join("").slice(0,2).toUpperCase();
const first=n=>String(n).split(" ")[0];
const kid=id=>S.kids.find(k=>k.id===id);
const grp=id=>S.grupe.find(g=>g.id===id);
const lokN=id=>S.lok.find(l=>l.id===id)?.name||"Bez lokacije";
const stf=id=>S.staff.find(s=>s.id===id);
const rodN=id=>S.rod[id]?.name||(String(id).startsWith("e:")?id.slice(2):"–");
const crow=id=>S.cfg.cijene.find(x=>x.id===id);
const cjL=id=>crow(id)?.l||"Bez članarine";
const TIP={clan:"Mjesečno po djetetu",sestre:"Mjesečno za dvije sestre (ukupno)",ostalo:"Ostalo"};
const kidRow=k=>crow(k.cijena)?(k.cijena):grp(k.grupa)?.cijena;
const gLoc=g=>[...new Set(g.days.map(d=>d[3]||g.locId))].map(lokN).join(", ")||lokN(g.locId);
const usesLoc=(g,l)=>g.locId===l||g.days.some(d=>d[3]===l);
const chip=(t,c)=>`<span class="chip ${c}">${esc(t)}</span>`;
const isStaff=()=>S.role==="admin"||S.role==="trener";
const activeGroups=()=>S.grupe.filter(g=>!g.arh);
const gTr=g=>g?(g.treneri&&g.treneri.length?g.treneri:(g.trener?[g.trener]:[])).filter(id=>stf(id)):[];
const myGroups=()=>S.role==="trener"?activeGroups().filter(g=>gTr(g).includes(S.me)):activeGroups();
const andList=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" i "+a[a.length-1];
function trnL(g){const t=gTr(g).map(stf);if(!t.length)return"trenerica –";if(t.length===1)return"trenerica "+t[0].ime;return"trenerice "+andList(t.map(x=>first(x.ime)))}
const groupKids=gid=>S.kids.filter(k=>k.status!=="ispisana"&&(k.grupa===gid||(k.dod||[]).includes(gid)));
const schedTxt=g=>g.days.map(d=>`${SD[d[0]]} ${d[1]}–${d[2]}`).join(" · ")||"Nema termina";
const clanica=n=>n===1?"1 članica":(n%10>=2&&n%10<=4&&(n%100<10||n%100>20))?n+" članice":n+" članica";
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.textContent=t;el.setAttribute("role","status");document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function li(av,title,sub,right,click,avCls=""){return `<${click?'button':'div'} class="li${click?" tap":""}" ${click?`onclick="${click}"`:""}>${av!==null?`<span class="av ${avCls}">${av}</span>`:""}<div class="grow"><b>${title}</b>${sub?`<div class="small muted">${sub}</div>`:""}</div>${right||""}${click?`<span class="chev">${I.chev}</span>`:""}</${click?'button':'div'}>`}
function backBar(t,fn="back()"){return `<div class="row"><button class="iconbtn" onclick="${fn}" aria-label="Nazad">${I.back}</button><h2 class="grow" style="font-size:21px">${t}</h2></div>`}

/* članarina po djetetu: popust za sestre */
function kidFee(k){
  const base=x=>crow(kidRow(x))?.v??0;
  const fam=S.kids.filter(x=>x.rod===k.rod&&x.status==="aktivna").sort((a,b)=>base(b)-base(a)||a.id.localeCompare(b.id,undefined,{numeric:true}));
  const i=fam.findIndex(x=>x.id===k.id);
  if(i!==1)return base(k);
  const ra=kidRow(fam[0]),rb=kidRow(fam[1]);
  const pr=S.cfg.cijene.find(c=>c.tip==="sestre"&&((c.a===ra&&c.b===rb)||(c.a===rb&&c.b===ra)));
  return pr?Math.max(0,pr.v-base(fam[0])):base(k);
}
const FEE_START="2026-09";   // članarine se računaju tek od septembra 2026.
const realUpisM=k=>k&&k.upis?k.upis.slice(0,7):"0000-00";
const upisM=k=>{const u=realUpisM(k);return u>FEE_START?u:FEE_START};
const elig=(k,m)=>!!k&&m>=upisM(k);
const NOPAY={prije:1,van:1,obrisano:1};
function payOf(kId,m){const r=S.pay[kId]?.[m],k=kid(kId);
  if(r&&r.s!=="neplaceno")return r;            // plaćene/ostale se nikad ne diraju
  if(!elig(k,m))return{s:m<realUpisM(k)?"prije":"van",row:!!r};      // mjesec prije upisa: nije dug
  return r||{s:k?.status==="pauza"?"pauza":"neplaceno"}}
const owes=(kId,m)=>!NOPAY[payOf(kId,m).s];
function preUpis(){const out=[];S.kids.forEach(k=>Object.entries(S.pay[k.id]||{}).forEach(([m,r])=>{if(r.s==="neplaceno"&&m<realUpisM(k))out.push({k,m})}));return out.sort((a,b)=>a.k.ime.localeCompare(b.k.ime,"bs")||a.m.localeCompare(b.m))}
function setPay(kId,m,v){(S.pay[kId]=S.pay[kId]||{})[m]=v;save()}
function debtsOf(k){const out=[];let amt=0;const fee=kidFee(k);
  monthsFrom(k).reverse().forEach(m=>{if(!isUnpaid(k,m)||dueState(k,m).st!=="dug")return;const p=payOf(k.id,m);
    amt+=fee-(p.s==="djelimicno"?(p.paid||0):0);out.push(MJF[+m.split("-")[1]-1].toLowerCase()+(p.s==="djelimicno"?" (djelimično)":""))});
  return{amt,months:out}}

/* ---------- dan uplate · sljedeća uplata · dug (10 dana poslije) ---------- */
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const addMonth=(m,n)=>{const[y,mo]=m.split("-").map(Number);return ym(new Date(y,mo-1+n,1))};
const fdz=s=>{if(!s)return"";const d=pd(s);return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()+"."};
function payDay(k){return k.danUplate||(k.upis?+k.upis.slice(8,10):0)||1}
function dueDate(k,m){const[y,mo]=m.split("-").map(Number);return iso(new Date(y,mo-1,Math.min(payDay(k),lastDay(y,mo))))}
function dueState(k,m){const d=dueDate(k,m),t=iso(today());if(t<d)return{st:"next",d};const dug=addD(d,10);return{st:t<dug?"late":"dug",d,dug}}
function isUnpaid(k,m){const s=payOf(k.id,m).s;return s==="neplaceno"||s==="djelimicno"}
function monthsFrom(k,back=24){const out=[];let m=ym();for(let i=0;i<back;i++){if(!elig(k,m))break;out.push(m);m=addMonth(m,-1)}return out}
function unpaidMonths(k){return monthsFrom(k).filter(m=>isUnpaid(k,m)).reverse()}
function nextPay(k){const u=unpaidMonths(k);if(u.length)return{m:u[0],...dueState(k,u[0])};let m=ym();for(let i=0;i<24&&!isUnpaid(k,m);i++)m=addMonth(m,1);return{m,st:"next",d:dueDate(k,m)}}
function dueTxt(k,m){const s=dueState(k,m);return s.st==="next"?"Sljedeća uplata: "+fdz(s.d):s.st==="late"?`Uplata bila ${fdz(s.d).slice(0,6)} · dug od ${fdz(s.dug).slice(0,6)}`:`<span class="red">Dug</span> · uplata bila ${fdz(s.d)}`}
function payChip(k,m){const p=payOf(k.id,m);if(!isUnpaid(k,m))return chip(...(PAY[p.s]||PAY.neplaceno));const st=dueState(k,m).st;
  return p.s==="djelimicno"?chip("Djelimično"+(st==="dug"?" · dug":""),st==="dug"?"bad":"info"):st==="dug"?chip("Dug","bad"):st==="late"?chip("Nije plaćeno","warn"):chip("Još nije vrijeme","n")}
const owedFor=(k,m)=>{const p=payOf(k.id,m);return Math.max(0,kidFee(k)-(p.s==="djelimicno"?(p.paid||0):0))};
const sisterOf=(k,m)=>S.kids.find(x=>x.rod===k.rod&&x.rod&&x.id!==k.id&&x.status==="aktivna"&&elig(x,m)&&isUnpaid(x,m));
function recordPay(kId,m,amount,date){const k=kid(kId),fee=kidFee(k),p=payOf(kId,m),already=p.s==="djelimicno"?(p.paid||0):0,tot=already+amount;
  setPay(kId,m,tot>=fee?{s:"placeno",paid:tot,d:date}:tot>0?{s:"djelimicno",paid:tot,d:date}:{s:"neplaceno"});
  if(amount>0&&m>=ym()){const dd=+date.slice(8,10);if(dd&&k.danUplate!==dd){k.danUplate=dd;save()}}}
function sisLabel(k,m){const sis=sisterOf(k,m);return sis?`<label class="checkrow sisrow"><input type="checkbox" id="paySis" data-k="${sis.id}" checked> Plaćeno i za sestru: <b>${esc(first(sis.ime))}</b> (${owedFor(sis,m)} KM)</label>`:""}
function paySis(m,date){const c=$("#paySis");if(c&&c.checked){const sis=kid(c.dataset.k);recordPay(sis.id,m,owedFor(sis,m),date);return first(sis.ime)}return null}
function askUndoPay(id,m){const k=kid(id),p=payOf(id,m);
  const sis=S.kids.find(x=>x.rod===k.rod&&x.rod&&x.id!==id&&S.pay[x.id]?.[m]&&["placeno","djelimicno"].includes(S.pay[x.id][m].s)&&S.pay[x.id][m].d&&S.pay[x.id][m].d===p.d);
  window.__undoSis=sis?.id||null;
  ask(`Poništiti uplatu za <b>${esc(k.ime)}</b> za ${ymL(m)}?${sis?`<label class="checkrow" style="margin-top:10px"><input type="checkbox" id="askChk" checked> Poništi i za sestru: <b>${esc(first(sis.ime))}</b> (plaćeno istog dana)</label>`:""}`,"Poništi uplatu",()=>{
    setPay(id,m,{s:"neplaceno"});if(window.__undoSis&&window.__askChk)setPay(window.__undoSis,m,{s:"neplaceno"});render();toast("Uplata poništena")})}
function payDayForm(id){const k=kid(id),sis=S.kids.find(x=>x.rod===k.rod&&x.rod&&x.id!==id&&x.status!=="ispisana");
  sheet(`<h2>Dan uplate</h2><p class="small muted" style="margin:0">${esc(k.ime)} plaća svakog <b>${payDay(k)}.</b> u mjesecu. Ako mjesec ima manje dana, uzima se zadnji dan.</p>
  <label class="f">Svakog … u mjesecu<input id="pdD" type="number" min="1" max="31" inputmode="numeric" value="${payDay(k)}"></label>
  ${sis?`<label class="checkrow"><input type="checkbox" id="pdS"> Isto i za sestru: <b>${esc(first(sis.ime))}</b> (sada ${payDay(sis)}.)</label>`:""}
  <p id="fErr" class="err" hidden></p><button class="btn block" onclick="savePayDay('${id}','${sis?.id||""}')">Sačuvaj</button>`)}
function savePayDay(id,sid){const d=parseInt($("#pdD").value);if(!(d>=1&&d<=31))return ferr("Upišite dan od 1 do 31.");kid(id).danUplate=d;if(sid&&$("#pdS")?.checked)kid(sid).danUplate=d;save();closeSheet();render();toast("Dan uplate sačuvan")}
function payCard(k){if(S.role!=="admin"||k.status==="ispisana")return"";
  const fee=kidFee(k),um=unpaidMonths(k),np=nextPay(k);
  const ahead=[0,1,2,3].map(i=>addMonth(ym(),i)).filter(m=>elig(k,m)&&isUnpaid(k,m));
  const opts=[...new Set([...um,...ahead])].sort();const sel=view.payM&&opts.concat([view.payM]).includes(view.payM)?view.payM:(um[0]||ahead[0]||np.m);
  if(!opts.includes(sel))opts.push(sel);opts.sort();
  return `<div class="card stack" id="payCard"><div class="row"><div class="grow"><div class="eyebrow">💳 Članarina</div><div class="score" style="font-size:26px">${fee} KM <span class="small muted" style="font-family:var(--body)">mjesečno</span></div></div></div>
  <div class="small">Plaća: svakog <b>${payDay(k)}.</b> u mjesecu · ${FEAT&&FEAT.v3?`<button class="lnk2" onclick="payDayForm('${k.id}')">promijeni</button>`:""}</div>
  ${um.length?`<div class="list">${um.map(m=>li(null,ymL(m)+` <span class="small muted">· ${owedFor(k,m)} KM</span>`,dueTxt(k,m),payChip(k,m))).join("")}</div>`
    :`<div class="okline">✓ Sve je plaćeno · Sljedeća uplata: <b>${fdz(np.d)}</b></div>`}
  <div class="payform"><div class="eyebrow">Evidentiraj uplatu${um.length?"":" unaprijed"}</div>
  <div class="grid2"><label class="f">Mjesec<select id="qpM" onchange="view.payM=this.value;render();document.getElementById('payCard')?.scrollIntoView({block:'center'})">${opts.map(m=>`<option value="${m}" ${m===sel?"selected":""}>${ymL(m)}</option>`).join("")}</select></label>
  <label class="f">Iznos (KM)<input id="qpA" type="number" min="0" inputmode="decimal" value="${owedFor(k,sel)}"></label></div>
  <label class="f">Datum uplate<input id="qpD" type="date" value="${iso(today())}"></label>
  ${sisLabel(k,sel)}<p id="qpErr" class="err" hidden></p>
  <button class="btn block" onclick="quickPay('${k.id}')">Sačuvaj uplatu</button></div></div>`}
function quickPay(id){const m=$("#qpM").value,a=Math.max(0,+String($("#qpA").value).replace(",",".")||0),d=$("#qpD").value;
  if(!a||!d){const e=$("#qpErr");e.textContent="Upišite iznos i datum uplate.";e.hidden=false;return}
  recordPay(id,m,a,d);const s=paySis(m,d);view.payM=null;render();toast("Uplata sačuvana: "+first(kid(id).ime)+(s?" i "+s:"")+" · "+ymL(m))}
function histCard(k){const id=k.id;
  const fut=Object.keys(S.pay[id]||{}).filter(m=>m>ym());const ms=[...new Set([...fut,...monthsFrom(k)])].sort().reverse();
  const all=[...new Set([...monthsFrom(k),...[1,2,3].map(i=>addMonth(ym(),i)).filter(m=>elig(k,m))])].sort().reverse();
  return `<div class="card"><div class="eyebrow">Historija članarina</div><div class="list" style="margin-top:4px">${ms.map(m=>{const p=payOf(id,m),un=isUnpaid(k,m);
    const sub=p.s==="placeno"||p.s==="djelimicno"?"uplaćeno "+fdz(p.d)+(p.s==="djelimicno"?` · ${p.paid} KM`:""):p.s==="ceka"?"čeka potvrdu":p.s==="obrisano"?"obrisana – nema obaveze":un?dueTxt(k,m):"";

function sessionOn(g,date){
  const z=S.izmjene.find(x=>x.g===g.id&&x.date===date);
  const reg=g.days.find(d=>d[0]===dIdx(date));
  if(z){if(z.type==="cancel")return{cancel:true,z};return{od:z.od,do:z.do,loc:z.locId||g.locId,z}}
  if(reg)return{od:reg[1],do:reg[2],loc:reg[3]||g.locId};return null}
function nextSession(g){for(let i=0;i<21;i++){const d=addD(iso(today()),i);const s=sessionOn(g,d);if(s&&!s.cancel)return{date:d,...s}}return null}
function lastSessionDate(g){for(let i=0;i<21;i++){const d=addD(iso(today()),-i);const s=sessionOn(g,d);if(s&&!s.cancel)return d}return iso(today())}

  const adm=S.role==="admin"?Object.keys(S.threads).filter(t=>t.startsWith("a:")&&(S.threads[t]||[]).length):[];

const unSeg=p=>{const n=(S.threads[p]||[]).filter(m=>!m.del&&m.f==="staff"&&m.t>(S.seen[p+"|r"]||"")).length;return n?` <span class="chip bad">${n}</span>`:""};

screens.pay=()=>{

  const act=S.kids.filter(k=>k.status!=="ispisana");
  let exp=0,col=0;act.forEach(k=>{if(k.status!=="aktivna")return;const fee=kidFee(k),p=payOf(k.id,m);if(NOPAY[p.s])return;exp+=fee;if(p.s==="placeno")col+=fee;if(p.s==="djelimicno")col+=p.paid||0});
  const pre=preUpis();
  const rows=act.filter(k=>{const s=payOf(k.id,m).s;if(NOPAY[s])return false;return f==="all"||(f==="neplaceno"?(s==="neplaceno"||s==="djelimicno"):s===f)}).sort((a,b)=>a.ime.localeCompare(b.ime,"bs"));
  const debts=S.kids.filter(k=>k.status==="aktivna").map(k=>({k,...debtsOf(k)})).filter(d=>d.amt>0);
  const months=sezMonths(curSez()).filter(x=>x<=ym());

  <div class="card"><div class="row" style="align-items:baseline"><span class="score" style="font-size:28px">${col} KM</span><span class="muted">od ${exp} KM</span></div><div class="bar"><div style="width:${exp?Math.min(100,col/exp*100):0}%"></div></div>
  <div class="small muted" style="margin-top:6px">Iznos po djetetu računa se po cjenovniku, s popustom za sestre. Dug je tek 10 dana poslije datuma uplate.</div></div>
  ${S.role==="admin"&&FEAT&&FEAT.v3?remCard():""}
  ${pre.length&&S.role==="admin"?`<div class="card warncard"><b>${pre.length} ${pre.length===1?"članarina je":"članarina je"} iz mjeseci prije upisa – to nije dug:</b>
    <ul>${pre.map(x=>`<li>${esc(x.k.ime)} – ${ymL(x.m)} (upisana ${fd(x.k.upis)})</li>`).join("")}</ul>
    <button class="btn sm" onclick="askRemovePre()">Ukloni ih</button></div>`:""}
  ${debts.length?`<div class="card"><div class="row"><div class="eyebrow grow">Dugovanja</div><b class="num" style="color:var(--bad)">${debts.reduce((a,d)=>a+d.amt,0)} KM</b></div><div class="list" style="margin-top:4px">${debts.map(d=>`<div style="cursor:pointer" onclick="tapPaid('${d.k.id}',unpaidMonths(kid('${d.k.id}'))[0])">${li(null,esc(d.k.ime),esc(d.months.join(", "))+" · dodirnite za uplatu",`<b class="num">${d.amt} KM</b>`)}</div>`).join("")}</div></div>`:""}
  <div class="chips">${[["all","Sve"],["neplaceno","Nije plaćeno"],["ceka","Čeka potvrdu"],["placeno","Plaćeno"]].map(([k,l])=>`<button class="${f===k?"on":""}" onclick="view.f='${k}';render()">${l}</button>`).join("")}</div>
  <div class="card"><div class="list">${rows.map(k=>{const p=payOf(k.id,m),fee=kidFee(k);const sis=S.kids.find(x=>x.rod===k.rod&&x.rod&&x.id!==k.id&&x.status==="aktivna");let info=`${sis?`<span style="color:var(--ok);font-weight:700">sestra: ${esc(first(sis.ime))}</span> · `:""}${esc(grp(k.grupa)?.name||"")} · ${fee} KM`;if(p.d)info+=` · ${p.s==="ceka"?"prijavljeno":"uplaćeno"} ${fd(p.d)}`;if(p.s==="djelimicno")info+=` · uplaćeno ${p.paid} KM`;if(isUnpaid(k,m))info+=` · ${dueTxt(k,m)}`;
    let act="";if(p.s==="ceka")act=`<button class="btn sm" onclick="confirmPay('${k.id}','${m}')">Potvrdi uplatu</button>`;
    else if(p.s==="neplaceno"||p.s==="djelimicno")act=`<button class="btn sm" style="background:var(--ok);color:#fff" onclick="tapPaid('${k.id}','${m}')">✓ Uplatila</button><button class="btn ghost sm" onclick="payForm('${k.id}','${m}')">Drugi iznos / datum</button>`+`<button class="btn ghost sm" onclick="remind('${k.id}','${m}')">Pošalji podsjetnik</button>${p.s==="neplaceno"&&S.role==="admin"?`<button class="btn ghost sm danger" onclick="askDelPay('${k.id}','${m}')">Obriši</button>`:""}`;
    if(p.s==="placeno"||(p.s==="djelimicno"&&S.role==="admin"))act+=`<button class="btn ghost sm" onclick="askUndoPay('${k.id}','${m}')">Poništi</button>`;

/* izvoz u Excel */
function reportData(t,m){const sz=curSez();
  if(t==="clanice")return[["Ime i prezime","Datum rođenja","Datum upisa","Grupa","Status","Roditelj","Telefon","E-mail","Članarina (KM)"],...S.kids.slice().sort((a,b)=>a.ime.localeCompare(b.ime,"bs")).map(k=>[k.ime,fd(k.dob),fd(k.upis),grp(k.grupa)?.name||"",MST[k.status][0],rodN(k.rod),S.rod[k.rod]?.tel||"",S.rod[k.rod]?.mail||"",k.status==="aktivna"?kidFee(k):0])];
  if(t==="uplate")return[["Ime i prezime","Grupa","Mjesec","Članarina (KM)","Status","Uplaćeno (KM)","Datum"],...S.kids.filter(k=>k.status!=="ispisana"&&owes(k.id,m)).map(k=>{const p=payOf(k.id,m),f=kidFee(k);return[k.ime,grp(k.grupa)?.name||"",ymL(m),f,(PAY[p.s]||PAY.neplaceno)[0],p.s==="placeno"?f:p.s==="djelimicno"?p.paid:0,fd(p.d)]})];
  if(t==="prisustvo")return[["Ime i prezime","Grupa","Prisutna","Opravdano","Izostala","Prisustvo %"],...S.kids.filter(k=>k.status!=="ispisana").map(k=>{const a={p:0,o:0,n:0};Object.entries(S.att).forEach(([key,v])=>{if(v[k.id]&&sez(key.slice(0,10))===sz)a[v[k.id]]++});const t=a.p+a.o+a.n;return[k.ime,grp(k.grupa)?.name||"",a.p,a.o,a.n,t?Math.round(a.p/t*100)+"%":"–"]})];
  if(t==="rezultati")return[["Datum","Takmičenje","Mjesto","Ime i prezime","Kategorija","Rekvizit","Ocjena","Plasman"],...S.results.map(r=>({r,e:S.events.find(e=>e.id===r.eventId)})).filter(x=>x.e&&sez(x.e.datum)===sz).sort((a,b)=>a.e.datum.localeCompare(b.e.datum)||a.r.plasman-b.r.plasman).map(({r,e})=>[fd(e.datum),e.naziv,e.mjesto,kid(r.kidId)?.ime||"",r.kategorija,r.rekvizit,r.ocjena.toFixed(3).replace(".",","),r.plasman])];
  return[]}
function exportScreen(){const t=view.t||"clanice",m=view.m||ym();const d=reportData(t,m);
  return `${backBar("Izvoz u Excel")}
  <div class="chips">${[["clanice","Članice"],["uplate","Uplate"],["prisustvo","Prisustvo"],["rezultati","Rezultati"]].map(([k,l])=>`<button class="${t===k?"on":""}" onclick="view.t='${k}';render()">${l}</button>`).join("")}</div>
  ${t==="uplate"?`<label class="f">Mjesec<select id="exM" onchange="view.m=this.value;render()">${sezMonths(curSez()).filter(x=>x<=ym()).map(x=>`<option value="${x}" ${x===m?"selected":""}>${ymL(x)}</option>`).join("")}</select></label>`:t!=="clanice"?`<p class="small muted" style="margin:0">Sezona ${curSez()}</p>`:""}

/* statistika */
function statsScreen(){const sz=curSez();const act=S.kids.filter(k=>k.status==="aktivna");
  const gRows=activeGroups().map(g=>{let p=0,t=0;Object.entries(S.att).forEach(([key,v])=>{if(key.endsWith("|"+g.id)&&sez(key.slice(0,10))===sz)Object.values(v).forEach(x=>{t++;if(x==="p")p++})});return{g,n:groupKids(g.id).filter(k=>k.status==="aktivna").length,pct:t?Math.round(p/t*100):null}});
  const maxN=Math.max(1,...gRows.map(r=>r.n));
  const months=sezMonths(sz).filter(m=>m<=ym()).map(m=>{let e=0,c=0;act.forEach(k=>{const f=kidFee(k),p=payOf(k.id,m);if(NOPAY[p.s])return;e+=f;if(p.s==="placeno")c+=f;if(p.s==="djelimicno")c+=p.paid||0});return{m,e,c}});
  const evs=S.events.filter(e=>sez(e.datum)===sz),rs=S.results.filter(r=>evs.some(e=>e.id===r.eventId));const med=n=>rs.filter(r=>r.plasman===n).length;
  const newK=S.kids.filter(k=>k.upis&&sez(k.upis)===sz).length;
  return `${backBar("Statistika kluba")}<p class="small muted" style="margin:0">Sezona ${sz}</p>
  <div class="tiles">${[[act.length,"Aktivne članice",""],[newK,"Novih ove sezone","pk"],[S.kids.filter(k=>k.status==="pauza").length,"Na pauzi","warn"]].map(([v,l,c])=>`<div class="tile ${c}"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
  <div class="card"><div class="eyebrow">Članice i prisustvo po grupi</div><div class="stack" style="margin-top:8px">${gRows.map(r=>`<div><div class="row small"><b class="grow">${esc(r.g.name)}</b><span class="muted">${clanica(r.n)}${r.pct!==null?` · prisustvo ${r.pct}%`:""}</span></div><div class="bar thin"><div style="width:${r.n/maxN*100}%;background:var(--accent)"></div></div></div>`).join("")}</div></div>
  <div class="card"><div class="eyebrow">Naplata članarina</div><div class="stack" style="margin-top:8px">${months.map(x=>`<div><div class="row small"><b class="grow">${MJF[+x.m.split("-")[1]-1]}</b><span class="num">${x.c} / ${x.e} KM</span></div><div class="bar thin"><div style="width:${x.e?Math.min(100,x.c/x.e*100):0}%"></div></div></div>`).join("")}</div></div>
  <div class="card"><div class="eyebrow">Takmičenja</div><div class="count"><div><b>${evs.length}</b><span>takmičenja</span></div><div><b>${rs.length}</b><span>nastupa</span></div></div>
  <div class="medals" style="margin-top:10px;justify-content:center">${[1,2,3].map(n=>`<div><span class="medal m${n}">${n}.</span>× ${med(n)}</div>`).join("")}</div></div>`}

  const last=S.cfg.cijene.at(-1);setTimeout(()=>{const i=$("#c_l_"+last.id);i?.focus();i?.select()},30)}
function delCijena(id){readCijene();const gs=S.grupe.filter(g=>!g.arh&&g.cijena===id);

  <div class="chips">${gs.map(x=>`<button class="${x.id===g.id?"on":""}" onclick="view.g='${x.id}';view.d=null;render()">${esc(x.name)}</button>`).join("")}</div>

  ${nx?`<div class="next"><span class="eyebrow">Sljedeći trening</span><b>${DAN[dIdx(nx.date)]}, ${fd(nx.date)} · ${nx.od}–${nx.do}</b><span class="small muted">${esc(lokN(nx.loc))}</span>${nx.z?`<span class="chip warn">Promjena termina</span>`:""}</div>`:""}</div>

function recCount(t){if(t.startsWith("ev:")){const e=S.events.find(x=>x.id===t.slice(3));return e?evParents(e).size:0}if(t==="all")return new Set(S.kids.filter(k=>k.status==="aktivna").map(k=>k.rod)).size;if(grp(t))return new Set(groupKids(t).map(k=>k.rod)).size;return 1}

/* ================= PORUKE ================= */

  if(view.p)return chatThread(view.p);

  ${seg==="chat"?`<p class="small muted" style="margin:0">Razgovore s članicama vidi i njihov roditelj.${S.role==="admin"&&FEAT&&FEAT.adm?" Razgovore s oznakom 🔒 vidite samo vi – trenerice ne.":""}</p>
  <div class="card"><div class="list">${ps.map(p=>{const c=S.threads[p]||[],last=c.at(-1),un=unreadFor(p);const kt=isKidT(p);

    return li(ini(kt?tKid(p).ime:rodN(pp)),title,`<span class="ell">${last?(last.del?"🚫 Poruka je obrisana":(last.f==="staff"?"Vi: ":"")+(last.img&&!last.x?"Fotografija":esc(last.x))):"Započnite razgovor"}</span>`,un?`<span class="chip bad">${un}</span>`:"",`sub({p:'${p}',scrollEnd:true})`)}).join("")}</div></div>`
  :`<button class="btn" onclick="noticeForm()">+ Nova obavijest</button>${notes.map(noticeCard).join("")}`}`;

function chatThread(p,ro){

  if(!ro)markSeen(p);
  const c=S.threads[p]||[],kt=isKidT(p),adm=isAdmT(p),pp=tPar(p);
  const tgs=kt?[grp(tKid(p)?.grupa)]:(isFam()?myKids():S.kids.filter(k=>isRod(k,pp))).flatMap(k=>[k.grupa,...(k.dod||[])]).map(grp);const tl=[...new Set(tgs.filter(Boolean).flatMap(gTr))].map(stf).filter(Boolean);const trn=esc(tl.length>1?"Trenerice "+andList(tl.map(x=>first(x.ime))):tl[0]?.ime||"Trenerica");

}

function sendImg(inp,p){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{

function dateBox(e){const d=pd(e.datum),past=days(e.datumDo||e.datum)<0;const dd=e.datumDo?d.getDate()+"–"+pd(e.datumDo).getDate():d.getDate();

function calScreen(){

  const card=e=>{const st=evStatus(e);let acts="";

    else{const w=evWait(e),ni=(e.neIde||[]).length,kl=kotizKids(e);acts=`<div class="small" style="flex-basis:100%">Prijavljeno <b>${e.prijave.length}</b>${e.pozvane?` · čeka roditelje <b style="color:var(--warn)">${w.length}</b> · ne ide <b>${ni}</b>`:""}</div>${chip(e.pozvane?"samo pozvane":"mogu sve članice",e.pozvane?"pk":"n")}<button class="btn sm" onclick="sub({det:'${e.id}'})">Otvori</button>${hasKotiz(e)&&kl.length?`<button class="btn ghost sm" onclick="kotizForm('${e.id}')">💳 Kotizacije ${(e.placeno||[]).filter(k=>kl.includes(k)).length}/${kl.length}</button>`:""}${S.role==="admin"?`<button class="btn ghost sm" onclick="eventForm('${e.id}')">Uredi</button>`:""}`}

  return `<div class="sec-h"><h2>Kalendar takmičenja</h2>${S.role==="admin"?`<button class="btn sm" onclick="eventForm()">+ Dodaj</button>`:""}</div>

}

function saveRod2(id){const k=kid(id),n=$("#r2N").value.trim(),m=$("#r2M").value.trim().toLowerCase(),t=$("#r2T").value.trim();

function askRemoveRod(id,which){const k=kid(id),rid=which==="1"?k.rod:k.rod2,r=S.rod[rid]||{};const fam=S.kids.filter(x=>x.rod===k.rod);

function askDelKid(id){const k=kid(id);
  sheet(`<h2>Trajno obrisati?</h2><p style="margin:0;line-height:1.5">Brišu se <b>svi podaci</b> za <b>${esc(k.ime)}</b>: članarine, prisustvo, prijave i rezultati. Ovo se ne može vratiti.</p>

function delKid(id){const k=kid(id);if($("#dkN").value.trim().toLowerCase()!==first(k.ime).toLowerCase())return ferr("Ime nije isto. Upišite: "+first(k.ime));
  const pr=(S.prof||[]).find(p=>p.clanica_id===id&&p.uloga==="clanica");if(pr)sb.rpc("admin_aktivan",{korisnik:pr.id,da:false}).then(()=>{},()=>{});
  S.kids=S.kids.filter(x=>x.id!==id);delete S.pay[id];Object.values(S.att).forEach(v=>delete v[id]);S.results=S.results.filter(r=>r.kidId!==id);
  S.events.forEach(e=>{e.prijave=e.prijave.filter(x=>x!==id);e.neIde=(e.neIde||[]).filter(x=>x!==id);e.placeno=(e.placeno||[]).filter(x=>x!==id);if(e.pozvane)e.pozvane=e.pozvane.filter(x=>x!==id)});
  Object.keys(S.inv).forEach(m=>{if(S.inv[m].clanica_id===id)delete S.inv[m]});
  save();closeSheet();go("members");toast(first(k.ime)+" je trajno obrisana")}


/* ---------- takmičenja: roditelj potvrđuje (Ide / Ne ide) ---------- */
const evWait=e=>e.pozvane?e.pozvane.filter(k=>{const x=kid(k);return x&&x.status!=="ispisana"&&!e.prijave.includes(k)&&!(e.neIde||[]).includes(k)}):[];
const kotizKids=e=>[...e.prijave,...(FEAT&&FEAT.v5?evWait(e):[])].filter(k=>kid(k));
function famAct(e,k){const st=evStatus(e),on=e.prijave.includes(k.id),ni=(e.neIde||[]).includes(k.id),open=st.k==="open",paid=(e.placeno||[]).includes(k.id),nm=esc(first(k.ime));
  const amt=hasKotiz(e)?`<span class="small muted">${NAST[nastOf(e,k.id)].toLowerCase()} · ${kidKotiz(e,k.id)} KM</span>`:"";
  if(on)return `<div class="kotrow"><span class="regok">✓ ${nm} ide</span>${kotizStatus(e,k)}${open&&!paid?`<button class="lnk2 small" onclick="event.stopPropagation();askChange('${e.id}','${k.id}')">Promijeni</button>`:""}</div>${famLine(e,k)}`;
  if(ni)return `<div class="kotrow">${chip(first(k.ime)+" ne ide","n")}${open?`<button class="lnk2 small" onclick="event.stopPropagation();parentAns('${e.id}','${k.id}','ide')">Ipak ide</button>`:""}</div>`;
  if(!canEnter(e,k))return `<div class="kotrow">${chip(first(k.ime)+": nije planirana","n")}</div>`;
  if(!open)return `<div class="kotrow">${chip(first(k.ime)+": rok za prijavu je prošao","n")}</div>`;
  if(e.pozvane&&FEAT&&FEAT.v5)return `<div class="askgo"><div><b>${nm} je pozvana.</b> Ide li na takmičenje?</div>${amt}<div class="row" style="gap:8px;margin-top:6px"><button class="btn sm" style="background:var(--ok);color:#fff" onclick="event.stopPropagation();parentAns('${e.id}','${k.id}','ide')">✓ Ide</button><button class="btn ghost sm" onclick="event.stopPropagation();parentAns('${e.id}','${k.id}','ne_ide')">Ne ide</button></div></div>`;
  return `<div class="kotrow"><button class="btn sm" onclick="event.stopPropagation();parentAns('${e.id}','${k.id}','ide')">Prijavi ${nm}</button>${amt}</div>`}
function askChange(eid,kId){const e=S.events.find(x=>x.id===eid),k=kid(kId);
  const pl=e.pozvane&&FEAT&&FEAT.v5;
  ask(`${pl?`<b>${esc(first(k.ime))}</b> ipak ne ide na „${esc(e.naziv)}“?`:`Odjaviti <b>${esc(first(k.ime))}</b> s takmičenja „${esc(e.naziv)}“?`}`,pl?"Ne ide":"Odjavi",()=>parentAns(eid,kId,pl?"ne_ide":"povuci"))}
function askOdjava(eid,kId){askChange(eid,kId)}
async function parentAns(eid,kId,odg){const e=S.events.find(x=>x.id===eid),k=kid(kId);
  let r;
  if(FEAT&&FEAT.v5)r=await sb.rpc("roditelj_takmicenje",{takm:eid,kid:kId,odgovor:odg});
  else if(odg==="ide")r=await sb.from("prijave").insert({takmicenje_id:eid,clanica_id:kId,prijavio:S.me,kotizacija_placena:false});
  else r=await sb.from("prijave").delete().match({takmicenje_id:eid,clanica_id:kId});
  if(r.error&&/duplicate|23505/.test(r.error.message||""))r={};
  if(r.error&&/row-level security|42501/i.test(r.error.message||""))return toast("Prijava nije moguća: rok je prošao ili djevojčica nije planirana. Javite se klubu.");
  if(r.error)return toast(/function|schema cache/i.test(r.error.message)?"Prijava trenutno ne radi. Javite se klubu.":r.error.message);
  e.prijave=e.prijave.filter(x=>x!==kId);e.neIde=(e.neIde||[]).filter(x=>x!==kId);
  if(odg==="ide")e.prijave.push(kId);if(odg==="ne_ide")e.neIde.push(kId);
  render();toast(odg==="ide"?`✓ ${first(k.ime)} ide na takmičenje`:odg==="ne_ide"?`Zabilježeno: ${first(k.ime)} ne ide`:`${first(k.ime)} je odjavljena`)}
function famEvCard(ev,k,cl){return `<div class="card"><div class="row"><div class="eyebrow grow">Sljedeće takmičenje</div><button class="lnk2 small" onclick="go('comp',{seg:'cal'})">Svi detalji</button></div><div class="ev" style="margin-top:8px">${dateBox(ev)}<div class="grow"><h3>${esc(ev.naziv)}</h3>${ev.organizator?`<div class="small muted">Organizator: ${esc(ev.organizator)}</div>`:""}<div class="meta"><span>${esc(ev.mjesto)}</span><span>Prijava do ${fd(ev.prijavaDo)}</span></div>
  <div style="margin-top:8px">${cl?(ev.prijave.includes(k.id)?`<span class="regok">✓ Ideš na takmičenje</span>`:chip((ev.neIde||[]).includes(k.id)?"Ne ideš":"Roditelj potvrđuje","n")):famAct(ev,k)}</div></div></div></div>`}

  <div class="eyebrow" style="margin-top:12px">Prijavljene (${pr.length})</div><div class="list">${pr.map(k=>row(k,`<button class="btn ghost sm danger" onclick="askUkloni('${id}','${k.id}')">Ukloni</button>`)).join("")||'<div class="li muted">Još niko.</div>'}</div>
  ${e.pozvane?`<div class="eyebrow" style="margin-top:12px">Čekaju potvrdu roditelja (${w.length})</div><div class="list">${w.map(k=>row(k,`<button class="btn sm" onclick="staffIde('${id}','${k.id}')">Prijavi</button><button class="btn ghost sm danger" onclick="askUkloni('${id}','${k.id}')">Ukloni</button>`)).join("")||'<div class="li muted">Svi roditelji su odgovorili. 🎉</div>'}</div>`:""}
  ${ni.length?`<div class="eyebrow" style="margin-top:12px">Ne idu (${ni.length})</div><div class="list">${ni.map(k=>row(k,`<button class="btn ghost sm" onclick="staffIde('${id}','${k.id}')">Ipak ide</button>`)).join("")}</div>`:""}
  ${e.pozvane&&w.length&&st.k==="open"?`<button class="btn ghost block" style="margin-top:10px" onclick="remindEv('${id}')">🔔 Podsjeti roditelje koji nisu odgovorili (${w.length})</button>`:""}</div>
  ${hasKotiz(e)&&kk.length?`<div class="card"><div class="row"><div class="eyebrow grow">Kotizacije</div>${chip(paidL.length+" od "+kk.length+" plaćeno","ok")}</div>
  <div class="row" style="align-items:baseline;margin-top:4px"><span class="score" style="font-size:26px">${paidS} KM</span><span class="muted">od ${tot} KM</span></div><div class="bar"><div style="width:${tot?paidS/tot*100:0}%"></div></div>
  <div class="list" style="margin-top:6px">${kk.map(k=>{const on=(e.placeno||[]).includes(k.id),dt=(e.placenoDat||{})[k.id];return `<div class="li"><div class="grow"><b>${esc(k.ime)}</b><div class="small muted">${NAST[nastOf(e,k.id)]} · ${kidKotiz(e,k.id)} KM${e.prijave.includes(k.id)?"":" · čeka potvrdu"}</div>${on?`<div class="small" style="color:var(--ok);font-weight:700">Plaćeno${dt?" "+fdz(dt):""}</div>`:""}</div>${on?`<button class="btn ghost sm" onclick="askUndoKotiz('${id}','${k.id}')">Poništi</button>`:`<button class="btn sm" onclick="setKotiz('${id}','${k.id}',true);render();toast('Kotizacija plaćena')">Plaćeno</button>`}</div>`}).join("")}</div></div>`:""}`}
function staffIde(eid,k){const e=S.events.find(x=>x.id===eid);if(!e.prijave.includes(k))e.prijave.push(k);e.neIde=(e.neIde||[]).filter(x=>x!==k);save();render();toast(first(kid(k).ime)+" je prijavljena")}
function askUkloni(eid,k){const e=S.events.find(x=>x.id===eid),paid=(e.placeno||[]).includes(k);
  ask(`Ukloniti <b>${esc(kid(k).ime)}</b> s takmičenja „${esc(e.naziv)}“?${paid?"<br><b>Kotizacija je već plaćena.</b>":""}`,"Ukloni",()=>{e.prijave=e.prijave.filter(x=>x!==k);e.neIde=(e.neIde||[]).filter(x=>x!==k);e.placeno=(e.placeno||[]).filter(x=>x!==k);if(e.pozvane)e.pozvane=e.pozvane.filter(x=>x!==k);save();render();toast("Uklonjena")})}
function remindEv(eid){const e=S.events.find(x=>x.id===eid);const byP={};evWait(e).map(kid).filter(k=>k&&k.rod&&!k.rod.startsWith("e:")).forEach(k=>(byP[k.rod]=byP[k.rod]||[]).push(k));
  Object.entries(byP).forEach(([rod,ks])=>S.notices.unshift({id:uid(),kind:"Takmičenje",title:"Potvrdite: "+e.naziv,body:`${ks.map(k=>first(k.ime)).join(" i ")} ${ks.length>1?"su pozvane":"je pozvana"} na takmičenje ${e.naziv} (${fd(e.datum)}).\nU aplikaciji (Takmičenja) potvrdite da li ide do ${fd(e.prijavaDo)}.`,d:iso(today()),from:S.me,tgt:rod}));
  save();render();toast("Podsjetnik poslan: "+Object.keys(byP).length+" roditelja")}

/* ---------- galerija slika i videa ---------- */
const GALURL={};let galLoading=false;
const galVisible=()=>(S.gal||[]).filter(g=>isStaff()||g.tgt==="all"||myKids().some(k=>k.grupa===g.tgt.slice(2)||(k.dod||[]).includes(g.tgt.slice(2))));
async function galUrls(items){const need=items.filter(g=>!(g.path in GALURL)).map(g=>g.path);if(!need.length||galLoading)return;galLoading=true;need.forEach(p=>GALURL[p]=null);
  try{for(let i=0;i<need.length;i+=100){const r=await sb.storage.from("galerija").createSignedUrls(need.slice(i,i+100),60*60*12);(r.data||[]).forEach(x=>{if(x.signedUrl)GALURL[x.path]=x.signedUrl})}}catch(e){console.warn(e)}
  galLoading=false;render()}
const galThumb=g=>{const u=GALURL[g.path];if(!u)return"";return g.type==="video"?`<video src="${u}#t=0.1" preload="metadata" muted playsinline></video><span class="play">▶</span>`:`<img src="${u}" loading="lazy" alt="">`};
screens.gal=()=>{const all=galVisible(),albums=[...new Set(all.map(g=>g.album).filter(Boolean))];const al=view.al||"";const xs=all.filter(g=>!al||g.album===al);
  galUrls(xs.slice(0,90));
  return `${backBar("Galerija",`go('${isStaff()&&S.role==="admin"?"more":TABS[S.role][0][0]}')`)}
  ${isStaff()?`<button class="btn block" onclick="galUpload()">${I.plus} Dodaj slike ili video</button>`:""}
  ${albums.length?`<div class="chips"><button class="${al?"":"on"}" onclick="view.al='';render()">Sve (${all.length})</button>${albums.map(a=>`<button class="${al===a?"on":""}" onclick="view.al='${esc(a).replace(/'/g,"&#39;")}';render()">${esc(a)}</button>`).join("")}</div>`:""}
  ${xs.length?`<div class="galgrid">${xs.map(g=>`<button onclick="galOpen('${g.id}')" aria-label="${g.type==="video"?"Video":"Slika"}">${galThumb(g)}</button>`).join("")}</div>`:`<div class="card muted">${isStaff()?"Još nema slika. Dodajte slike sa takmičenja ili kratke videe s treninga.":"Klub još nije dodao slike."}</div>`}`};
function galCard(){if(!FEAT||!FEAT.gal)return"";const xs=galVisible();if(!xs.length)return"";galUrls(xs.slice(0,3));
  return `<button class="card" style="text-align:left;width:100%" onclick="go('gal')"><div class="row"><div class="eyebrow grow">📷 Galerija · ${xs.length}</div><span class="lnk2 small">Otvori</span></div><div class="galthumbs">${xs.slice(0,3).map(g=>`<span>${GALURL[g.path]?(g.type==="video"?`<video src="${GALURL[g.path]}#t=0.1" preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover"></video>`:`<img src="${GALURL[g.path]}" alt="">`):""}</span>`).join("")}</div></button>`}
function galOpen(id){const g=S.gal.find(x=>x.id===id),u=GALURL[g.path]||"";const canDel=S.role==="admin"||g.from===S.me;
  sheet(`<div class="galview">${g.type==="video"?`<video src="${u}" controls playsinline autoplay></video>`:`<img src="${u}" alt="">`}</div>
  ${g.album||g.opis?`<div><b>${esc(g.album||"")}</b>${g.opis?`<div class="small" style="white-space:pre-line">${esc(g.opis)}</div>`:""}</div>`:""}
  <div class="small muted">${fdz(iso(new Date(g.ts||Date.now())))}${g.tgt!=="all"&&grp(g.tgt.slice(2))?" · grupa "+esc(grp(g.tgt.slice(2)).name):""}</div>
  <a class="btn ghost block" href="${u}" download target="_blank" rel="noopener">Preuzmi</a>
  ${canDel?`<button class="btn ghost block danger" onclick="askGalDel('${id}')">Obriši</button>`:""}`)}
function askGalDel(id){ask("Obrisati ovu sliku/video iz galerije?","Obriši",async()=>{const g=S.gal.find(x=>x.id===id);
  const r=await sb.from("galerija").delete().eq("id",id);if(r.error)return toast("Nije obrisano: "+r.error.message);
  sb.storage.from("galerija").remove([g.path]).then(()=>{},()=>{});S.gal=S.gal.filter(x=>x.id!==id);render();toast("Obrisano")})}
function galUpload(){if(!isStaff())return;const albums=[...new Set((S.gal||[]).map(g=>g.album).filter(Boolean))];
  const opts=(S.role==="admin"?activeGroups():myGroups()).map(g=>[g.id,"Grupa "+g.name]);
  sheet(`<h2>Dodaj u galeriju</h2>
  <label class="f">Slike ili video (može više odjednom)<input id="gF" type="file" accept="image/*,video/*" multiple></label>
  <p class="small muted" style="margin:0">Video najviše 50 MB (oko 1 minute). Slike se same smanje da se brže učitavaju.</p>
  <label class="f">Album (npr. takmičenje ili trening)<input id="gA" list="gAL" placeholder="npr. Ritam Cup 2026"><datalist id="gAL">${albums.map(a=>`<option value="${esc(a)}">`).join("")}${S.events.slice(-6).map(e=>`<option value="${esc(e.naziv)}">`).join("")}</datalist></label>
  <label class="f">Opis (nije obavezno)<input id="gO"></label>
  <label class="f">Ko vidi<select id="gT">${[["all","Svi roditelji i članice"],...opts].map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select></label>
  <label class="checkrow"><input type="checkbox" id="gN" checked> Pošalji obavijest roditeljima</label>
  <p id="fErr" class="err" hidden></p><p id="gP" class="small" style="margin:0;font-weight:700"></p>
  <button class="btn block" id="gB" onclick="galSend()">Dodaj u galeriju</button>`)}
async function galShrink(f){if(!f.type.startsWith("image/")||f.type==="image/gif")return f;
  try{const b=await createImageBitmap(f);const sc=Math.min(1,1920/Math.max(b.width,b.height));if(sc===1&&f.size<1.5e6)return f;
    const c=document.createElement("canvas");c.width=Math.round(b.width*sc);c.height=Math.round(b.height*sc);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(x=>r(x||f),"image/jpeg",.85))}catch(e){return f}}
async function galSend(){const fs=[...($("#gF").files||[])];if(!fs.length)return ferr("Izaberite slike ili video.");
  const big=fs.filter(f=>f.type.startsWith("video/")&&f.size>50*1024*1024);if(big.length)return ferr(`Video je prevelik (${Math.round(big[0].size/1048576)} MB). Najviše 50 MB – skratite video ili ga pošaljite kraći.`);
  const tgt=$("#gT").value,album=$("#gA").value.trim(),opis=$("#gO").value.trim(),notify=$("#gN").checked;$("#gB").disabled=true;
  const cilj=tgt==="all"?"all":"g:"+tgt;let ok=0,errs=0;
  for(let i=0;i<fs.length;i++){$("#gP").textContent=`Šaljem ${i+1} od ${fs.length}…`;const f=fs[i],vid=f.type.startsWith("video/");
    try{const blob=vid?f:await galShrink(f);const ext=vid?((f.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")||"mp4"):(blob.type==="image/jpeg"?"jpg":(f.name.split(".").pop()||"jpg").toLowerCase());
      const path=`${tgt==="all"?"svi":tgt}/${uid()}.${ext}`;
      const up=await sb.storage.from("galerija").upload(path,blob,{contentType:blob.type||f.type||"application/octet-stream",upsert:false});if(up.error)throw up.error;
      const row={id:uid(),putanja:path,vrsta:vid?"video":"slika",opis:opis||null,album:album||null,cilj,autor_id:S.me};
      const r=await sb.from("galerija").insert(row);if(r.error)throw r.error;
      S.gal=S.gal||[];S.gal.unshift({id:row.id,path,type:row.vrsta,opis,album,tgt:cilj,from:S.me,ts:new Date().toISOString()});ok++}
    catch(e){console.error(e);errs++;if(/bucket|relation|schema cache/i.test(e.message||""))break}}
  if(ok&&notify){const nV=S.gal.slice(0,ok).filter(g=>g.type==="video").length,nS=ok-nV;
    S.notices.unshift({id:uid(),kind:"Obavijest",title:"📷 Nove slike u galeriji"+(album?": "+album:""),body:`Dodano: ${[nS?nS+(nS===1?" slika":" slika"):"",nV?nV+(nV===1?" video":" videa"):""].filter(Boolean).join(" i ")}.\nPogledajte u aplikaciji: Početna → Galerija.`,d:iso(today()),from:S.me,tgt:tgt});save()}
  if(!ok){$("#gB").disabled=false;$("#gP").textContent="";return ferr(errs?"Slanje nije uspjelo. Provjerite internet (ili da je pokrenut novi SQL) pa pokušajte ponovo.":"")}
  closeSheet();go("gal");toast(`Dodano u galeriju: ${ok}${errs?` (nije uspjelo: ${errs})`:""}`)}

/* ================= OBAVEZNE OBAVIJESTI ================= */
const potvOf=(n,u)=>(S.potv&&S.potv[n.id]||{})[u];
const fdt=t=>{const d=new Date(t),z=x=>String(x).padStart(2,"0");return `${z(d.getDate())}.${z(d.getMonth()+1)}.${d.getFullYear()}. u ${z(d.getHours())}:${z(d.getMinutes())}`};
// roditelji (s računom) koji trebaju potvrditi obavijest
function obvRecip(n){let ks=[];const t=n.tgt;
  if(t==="all")ks=S.kids.filter(k=>k.status==="aktivna");else if(grp(t))ks=groupKids(t);
  else if(t.startsWith("ev:")){const e=S.events.find(x=>x.id===t.slice(3));ks=e?S.kids.filter(k=>k.status==="aktivna"&&canEnter(e,k)):[]}
  else return t&&!t.startsWith("e:")?[t]:[];
  const ids=new Set();ks.forEach(k=>{[k.rod,k.rod2].forEach(r=>{if(r&&!r.startsWith("e:"))ids.add(r)})});return [...ids]}
function obvStatus(n){if(!n.btn)return"";
  if(S.role==="roditelj"){const t=potvOf(n,S.me);return `<div class="row" style="margin-top:8px;gap:8px">${t?chip("Potvrđeno ✓ "+fdt(t),"ok"):`${chip("Nova","warn")}<button class="btn sm" onclick="mustShow('${n.id}')">Pročitaj i potvrdi</button>`}</div>`}
  if(S.role==="admin"){const r=obvRecip(n),c=r.filter(u=>potvOf(n,u)).length;return `<div style="margin-top:8px"><div class="bar thin"><div style="width:${r.length?c/r.length*100:0}%;background:var(--accent)"></div></div><div class="row" style="margin-top:4px"><span class="small grow"><b>${c} od ${r.length}</b> potvrdilo${n.must?" · 🔒 obavezna":""}</span><button class="lnk2 small" onclick="obvWho('${n.id}')">Ko je potvrdio</button></div></div>`}
  return ""}
/* --- roditelj: obavijest preko cijelog ekrana --- */
let MUST=null;
function mustList(){if(S.role!=="roditelj"||!PROFIL)return[];return noticesFor(famRod()).filter(n=>n.must&&n.btn&&!potvOf(n,S.me)).sort((a,b)=>(a.ts||a.d).localeCompare(b.ts||b.d))}
function mustCheck(){if(MUST||document.getElementById("mustOv"))return;const l=mustList();if(l.length)mustShow(l[0].id)}
function mustShow(id){const n=S.notices.find(x=>x.id===id);if(!n)return;MUST={id,end:false};const l=mustList(),pos=l.findIndex(x=>x.id===id);
  document.getElementById("mustOv")?.remove();const ov=document.createElement("div");ov.id="mustOv";ov.className="mustov";
  ov.innerHTML=`<div class="mustsheet" id="mustSh" role="dialog" aria-modal="true" aria-labelledby="mustT">
    <div class="musthead"><div class="row"><span class="musttag">${n.must?"⚠️ OBAVEZNO PROČITATI":"📢 OBAVIJEST"}</span>${l.length>1&&pos>=0?`<span class="small muted grow" style="text-align:right">${pos+1} od ${l.length}</span>`:""}</div>
      <h2 id="mustT">${esc(n.title)}</h2><div class="small muted">Objavljeno: ${fdz(n.d)} · ${esc(stf(n.from)?.ime||"Uprava kluba")}</div></div>
    <div class="mustbody" id="mustB">${esc(n.body)}</div>
    <div class="mustfoot"><p class="small muted" id="mustN" style="text-align:center;margin:0 0 8px"></p>
      ${n.btn==="slazem"?`<label class="checkrow" style="align-items:flex-start;margin-bottom:10px"><input type="checkbox" id="mustC" onchange="mustUpd()"> <span>Pročitala sam obavijest i slažem se s navedenim.</span></label>`:""}
      <button class="btn block" id="mustBtn" disabled onclick="mustConfirm()" style="padding:14px;font-size:16px">${n.btn==="slazem"?"✅ Slažem se":"✅ Pročitao/la sam"}</button>
      ${n.must?"":`<button class="btn ghost block" style="margin-top:8px" onclick="mustClose()">Kasnije</button>`}</div></div>`;
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  ov.addEventListener("click",e=>{if(e.target===ov){if(!n.must)return mustClose();const s=$("#mustSh");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake");toast("Prvo pročitajte i potvrdite obavijest")}});
  const b=$("#mustB");b.addEventListener("scroll",()=>{if(MUST&&b.scrollTop+b.clientHeight>=b.scrollHeight-10){MUST.end=true;mustUpd()}});
  setTimeout(()=>{if(!MUST)return;if(b.scrollHeight<=b.clientHeight+10)MUST.end=true;mustUpd()},80)}
function mustUpd(){if(!MUST)return;const n=S.notices.find(x=>x.id===MUST.id),c=$("#mustC");const ok=MUST.end&&(n.btn!=="slazem"||c?.checked);
  $("#mustBtn").disabled=!ok;$("#mustN").textContent=!MUST.end?"⬇️ Skrolajte do kraja da možete potvrditi":(n.btn==="slazem"&&!c?.checked?"☑️ Označite kvačicu da potvrdite":"Spremno – dodirnite dugme")}
function mustClose(){document.getElementById("mustOv")?.remove();document.body.style.overflow="";MUST=null}
async function mustConfirm(){if(!MUST)return;const id=MUST.id;$("#mustBtn").disabled=true;
  const r=await sb.from("obavijesti_potvrde").insert({obavijest_id:id,korisnik_id:S.me});
  if(r.error&&!/duplicate|23505/.test(r.error.message||"")){$("#mustBtn").disabled=false;return toast("Nije sačuvano, provjerite internet i pokušajte ponovo.")}
  S.potv=S.potv||{};(S.potv[id]=S.potv[id]||{})[S.me]=new Date().toISOString();
  mustClose();render();toast("✓ Potvrđeno – hvala!")}
/* --- admin: obavijesti i ko je potvrdio --- */
function obvScreen(){const xs=S.notices.slice().sort((a,b)=>(b.ts||b.d).localeCompare(a.ts||a.d));
  return `${backBar("Obavijesti")}
  <p class="small muted" style="margin:0">Obavezna obavijest iskoči roditelju preko cijelog ekrana čim otvori aplikaciju i ne može dalje dok je ne pročita do kraja i potvrdi. Ovdje vidite ko je potvrdio i kada.</p>
  <button class="btn block" onclick="noticeForm('all')">${I.plus} Nova obavijest</button>
  ${xs.map(n=>`<div class="card"><div class="row"><span class="small" style="font-weight:800;color:var(--accent)">${n.must?"🔒 OBAVEZNA":n.btn?"S POTVRDOM":"OBIČNA"}${n.btn?` · ${n.btn==="slazem"?"„Slažem se”":"„Pročitao/la sam”"}`:""}</span><span class="small muted grow" style="text-align:right">${fd(n.d)}</span></div>
    <h3 style="margin-top:4px">${esc(n.title)}</h3><div class="small muted">Za: ${esc(tgtLabel(n.tgt))}</div>${obvStatus(n)}
    <div class="acts"><button class="btn ghost sm danger" onclick="askDelNotice('${n.id}')">Obriši</button></div></div>`).join("")||'<div class="card muted">Još nema obavijesti.</div>'}`}
function obvWho(id){const n=S.notices.find(x=>x.id===id),r=obvRecip(n);
  const row=u=>{const t=potvOf(n,u),ks=S.kids.filter(k=>isRod(k,u)&&k.status!=="ispisana").map(k=>first(k.ime)).join(" i ");
    return {t,h:`<div class="li"><span class="av">${ini(rodN(u))}</span><div class="grow"><b>${esc(rodN(u))}</b>${ks?` <span class="small muted">· ${esc(ks)}</span>`:""}<div class="small ${t?"":"muted"}" style="${t?"color:var(--ok);font-weight:700":""}">${t?"Potvrđeno "+fdt(t):"Još nije potvrdio/la"}</div></div>${t?chip("✓","ok"):chip("Čeka","warn")}</div>`}};
  const rows=r.map(row),yes=rows.filter(x=>x.t).sort((a,b)=>a.t.localeCompare(b.t)),no=rows.filter(x=>!x.t);
  sheet(`<h2>${esc(n.title)}</h2><p class="small muted" style="margin:0">${n.must?"🔒 Obavezna · ":""}Za: ${esc(tgtLabel(n.tgt))}</p>
  <div class="bar"><div style="width:${r.length?yes.length/r.length*100:0}%;background:var(--accent)"></div></div><p style="margin:0"><b>${yes.length} od ${r.length}</b> roditelja potvrdilo</p>
  ${no.length?`<div class="eyebrow">Još nisu potvrdili (${no.length})</div><div class="list">${no.map(x=>x.h).join("")}</div>`:""}
  ${yes.length?`<div class="eyebrow">Potvrdili (${yes.length})</div><div class="list">${yes.map(x=>x.h).join("")}</div>`:""}
  <p class="small muted" style="margin:0">Roditelji koji još nisu napravili račun nisu na spisku.</p>`)}

boot();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
